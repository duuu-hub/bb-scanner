name: AOA Fidelity V2

on:
  push:
    branches: [research-aoa-fidelity-v2]
    paths:
      - "research/aoa_fidelity_v2/**"
      - ".github/workflows/aoa-fidelity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt scikit-learn
      - run: python -m py_compile research/aoa_fidelity_v2/tune_validate.py
      - run: python research/aoa_fidelity_v2/tune_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoa-fidelity-v2-results
          path: research/aoa_fidelity_v2/output/
          if-no-files-found: error
          retention-days: 30
