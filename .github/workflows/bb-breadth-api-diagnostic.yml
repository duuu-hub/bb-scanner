name: BB Breadth API Diagnostic
on:
  push:
    branches:
      - research-bb-event-anatomy
    paths:
      - '.research/bb_breadth_diag_once'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      BACKTEST_API_RPS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-backtest.txt
      - run: python research/bb_breadth_api_diagnostic.py
