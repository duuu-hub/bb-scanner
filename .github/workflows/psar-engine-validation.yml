name: PSAR Engine Validation
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_engine_validation_run']
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Chronology and canonical invariants
        run: python scripts/psar_chronology_smoke.py
      - name: Optimization parity review 30x
        run: python scripts/psar_optimization_review.py
      - name: Upload optimization review
        uses: actions/upload-artifact@v4
        with:
          name: psar-optimization-review
          path: psar_optimization_review.json
