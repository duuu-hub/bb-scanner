name: Capitulation Reclaim LONG 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/capitulation_reclaim_long_run']
permissions: {contents: read, actions: read}
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Download source shard
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p data
          gh run download 36095439671 -R ${{ github.repository }} -p "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D data
      - name: Run capitulation reclaim scan
        run: |
          python scripts/capitulation_reclaim_long_scan.py --data data             --events events_${{ matrix.shard }}.csv.gz             --meta meta_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: capitulation-reclaim-long-${{ matrix.shard }}
          path: |
            events_${{ matrix.shard }}.csv.gz
            meta_${{ matrix.shard }}.json
  analyze:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: capitulation-reclaim-long-*
          path: cap
      - name: Download BTC source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p btc
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-3' -D btc
      - name: Analyze
        run: python scripts/capitulation_reclaim_long_analyze.py --root cap --btc btc --out cap_analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: capitulation-reclaim-long-analysis
          path: cap_analysis.json
