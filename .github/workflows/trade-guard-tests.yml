name: Trade Guard Tests

on:
  push:
    branches:
      - demo-trading-env
    paths:
      - 'trade_guard.py'
      - 'tests/test_trade_guard.py'
      - 'config/trading_config.json'
      - '.github/workflows/trade-guard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety-engine tests
        run: python -m unittest -v tests/test_trade_guard.py
