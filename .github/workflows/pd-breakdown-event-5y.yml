name: PD Breakdown 5Y Event Validation
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_event_5y_once']
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_event_5y.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: input}
      - run: python research/pd_breakdown_event_5y.py --trades input/trades_all.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/threshold_summary.csv");y=pd.read_csv("out/threshold_yearly.csv")
          assert set(s.min_signals)=={51,61,81,101}
          assert (s.events>0).all() and len(y)>0
          print("VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-5y-event-validation-VERIFIED, path: out/, if-no-files-found: error}
