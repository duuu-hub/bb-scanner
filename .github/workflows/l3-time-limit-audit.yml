name: L3 Time Limit Audit
on:
  push:
    branches:
      - research-l3-time-limit
    paths:
      - '.research/l3_time_limit_once'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      BACKTEST_WORKERS: 8
      BACKTEST_API_RPS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-backtest.txt
      - name: Download prior L3 results and breadth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/l3 input/regime
          gh run download 35944354692 --repo duuu-hub/bb-scanner --name l3-lite-frequency-fast-results --dir input/l3
          gh run download 35841732224 --repo duuu-hub/bb-scanner --name regime-breadth-research --dir input/regime
          find input -maxdepth 5 -type f -print
      - name: Resolve files
        run: |
          OLD=$(find input/l3 -name auto50_overlap_signals.csv | head -1)
          NEW=$(find input/l3 -name new66_holdout_signals.csv | head -1)
          REG=$(find input/regime -name breadth_timeseries.csv.gz | head -1)
          test -n "$OLD" && test -n "$NEW" && test -n "$REG"
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "REG=$REG" >> "$GITHUB_ENV"
      - name: Audit time limits and unlimited barrier exits
        run: |
          python research/l3_time_limit_audit.py \
            --signals-old "$OLD" \
            --signals-new "$NEW" \
            --regime "$REG" \
            --outdir l3_time_limit_results \
            --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-time-limit-results
          path: l3_time_limit_results/
          retention-days: 14
