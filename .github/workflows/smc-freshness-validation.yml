name: SMC Freshness Validation

on:
  push:
    branches:
      - fix-smc-stale-setup-freshness
    paths:
      - "smc_demo_forward.py"
      - "smc_forward_engine.py"
      - "tests/test_smc_forward.py"
      - ".github/workflows/smc-freshness-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-backtest.txt
          pip install pytest
      - name: Unit tests
        run: PYTHONPATH=. python -m pytest -q tests/test_smc_forward.py
      - name: Fresh public-data scan only
        run: python smc_demo_forward.py --scan-only
