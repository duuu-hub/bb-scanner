name: Audit Legacy AUTO100

on:
  push:
    branches:
      - research-env-optimize
    paths:
      - "research/audit_legacy_auto100.py"
      - ".github/workflows/audit-legacy-auto100.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-env-optimize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt
      - run: python -m research.audit_legacy_auto100
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/legacy_auto100_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record legacy AUTO100 universe audit"
          git pull --rebase origin research-env-optimize
          git push origin HEAD:research-env-optimize
