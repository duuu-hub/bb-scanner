name: PD Breakdown Regime Features
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_regime_features_once']
permissions: {contents: write, actions: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_regime_features.py
      - name: Download all canonical candle shards
        run: |
          mkdir -p input
          for s in 0 1 2 3 4 5 6 7; do gh run download 36095439671 -n rank5-binance-um-15m-5y-data-shard-$s -D input/shard-$s; done
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - run: python research/pd_breakdown_regime_features.py --input input --trades trades/trades_all.csv --out out
      - name: Validate no-lookahead outputs
        run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/summary.csv");e=pd.read_csv("out/events_features.csv");f=pd.read_csv("out/feature_separation.csv")
          assert len(s)==1 and s.events_51plus.iloc[0]==30 and s.oos_events.iloc[0]==929
          assert bool(s.feature_time_integrity.iloc[0])
          assert s.symbols.iloc[0]>=600
          assert len(f)>=5 and len(e)==30
          print("VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-regime-features-VERIFIED, path: out/, if-no-files-found: error}
      - name: Persist verified results
        run: |
          mkdir -p research/results/pd_breakdown_regime_features
          cp out/*.csv research/results/pd_breakdown_regime_features/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/results/pd_breakdown_regime_features
          git commit -m "research: persist verified regime features" || exit 0
          git push origin HEAD:research/pd-4h-binance-universe
