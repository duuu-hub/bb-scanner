name: Breakout Algo3 Proxy Replay 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/breakout_algo3_run']
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Syntax
        run: python -m py_compile scripts/breakout_algo3_replay.py scripts/breakout_algo3_merge.py scripts/external_breakout_replay.py
      - name: Import and frozen config smoke
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          import scripts.breakout_algo3_replay as x
          assert len(x.CONFIGS)==6
          assert all(c['r']==1.0 for c in x.CONFIGS)
          assert all(c['sl']==1.0 for c in x.CONFIGS)
          assert x.m.MAXH==16
          print('BREAKOUT_ALGO3_SMOKE_PASS')
          PY

  replay:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen Binance 15m 5Y data
        env:
          GH_TOKEN: '\${{ github.token }}'
        run: |
          mkdir -p data
          gh run download 36095439671 -R \${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Replay shard
        run: python scripts/breakout_algo3_replay.py --data data --shard \${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: breakout-algo3-replay-\${{ matrix.shard }}
          path: |
            breakout_algo3_trades_shard_\${{ matrix.shard }}.csv.gz
            breakout_algo3_meta_shard_\${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: breakout-algo3-replay-*
          path: artifacts
      - name: Merge and frozen train/holdout report
        run: python scripts/breakout_algo3_merge.py --input artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: breakout-algo3-final
          path: |
            breakout_algo3_summary.csv
            breakout_algo3_train_holdout.csv
            breakout_algo3_report.md
            breakout_algo3_all_trades.csv.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
