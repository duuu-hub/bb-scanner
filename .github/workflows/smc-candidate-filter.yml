name: SMC Candidate Filter

on:
  push:
    branches:
      - research-liquid-smc
    paths:
      - "research/smc_candidate_filter.py"
      - ".github/workflows/smc-candidate-filter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-liquid-smc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt
      - run: python -m research.smc_candidate_filter
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/smc_candidate_filter
          git commit -m "research: persist strict SMC candidate filter"
          git pull --rebase origin research-liquid-smc
          git push origin HEAD:research-liquid-smc
