name: VWAP20 BTC Bear Alt Down Exact 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/vwap20_btc_bear_exact_run']
permissions: {contents: read, actions: read}
jobs:
  backtest:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-rank5-binance-15m-5y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 requests
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir data regime
          gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
          gh run download 36735084022 -R ${{ github.repository }} -n vwap20-intersection-btc-regime -D regime
      - run: python scripts/vwap20_btc_bear_alt_down_5y.py backtest --data data --regime regime/btc_regime.csv --out events_${{ matrix.shard }}.csv --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with: {name: 'vwap20-bear-exact-shard-${{ matrix.shard }}', path: 'events_${{ matrix.shard }}.csv', if-no-files-found: error}
  summary:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 requests
      - uses: actions/download-artifact@v4
        with: {pattern: 'vwap20-bear-exact-shard-*', path: in, merge-multiple: true}
      - run: mkdir out && python scripts/vwap20_btc_bear_alt_down_5y.py summarize --in in --outdir out
      - uses: actions/upload-artifact@v4
        with: {name: vwap20-bear-exact-results, path: 'out/*'}
