name: BTC Strategy Lab Replication

on:
  workflow_dispatch:
  push:
    branches:
      - research-btc-strategy-lab-replication
    paths:
      - 'research/btc_strategy_lab_replication/**'
      - '.github/workflows/btc-strategy-lab-replication.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-btc-strategy-lab-replication
          fetch-depth: 0
      - name: Bring BTC history from existing research branch
        run: |
          git checkout origin/research-btc-eth-core -- market_data_store/bitget/15m/BTCUSDT
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Run baseline replication
        run: python research/btc_strategy_lab_replication/run_baseline.py
      - name: Download source funding data
        run: |
          mkdir -p research/btc_strategy_lab_replication/source_data
          curl -L --fail https://raw.githubusercontent.com/wiktorj137/btc-strategy-lab/main/research/webdata/funding.feather -o research/btc_strategy_lab_replication/source_data/funding.feather
      - name: Run funding replication
        run: python research/btc_strategy_lab_replication/run_funding.py
      - name: Run robustness sweep and walk-forward
        run: python research/btc_strategy_lab_replication/run_robustness.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/btc_strategy_lab_replication
          git commit -m "research: run BTC EMA600 replication" || exit 0
          git push origin HEAD:research-btc-strategy-lab-replication
