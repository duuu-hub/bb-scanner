name: PD Breakdown Chronological Portfolio
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_chrono_portfolio_once']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_chrono_portfolio.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - run: python research/pd_breakdown_chrono_portfolio.py --trades trades/trades_all.csv --wf wf/walkforward.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np
          r=pd.read_csv("out/chronological_portfolio.csv")
          assert len(r)==72 and (r.accepted_trades<=r.candidate_trades).all() and (r.mdd>=0).all()
          assert np.isfinite(r.final_equity).all() and (r.final_equity>0).all()
          print("VERIFIED",len(r))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-chrono-portfolio-VERIFIED, path: out/, if-no-files-found: error}
