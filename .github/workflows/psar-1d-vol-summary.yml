name: PSAR 1D Volatility BOTH Summary
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1d_vol_summary_run']
permissions: {contents: read, actions: read}
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download ledger
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p in && gh run download 36710246395 -R ${{ github.repository }} -p 'psar-1d-vol-both-*' -D in
      - run: python -m py_compile scripts/psar_1d_vol_summary.py && python scripts/psar_1d_vol_summary.py | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1d-vol-both-summary
          path: |
            vol_summary.csv
            summary.txt
