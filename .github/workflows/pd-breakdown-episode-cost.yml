name: PD Breakdown Episode Cost Audit
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_episode_cost_once']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_episode_cost.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: input}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - run: python research/pd_breakdown_episode_cost.py --trades input/trades_all.csv --wf wf/walkforward.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd, numpy as np
          p=pd.read_csv("out/episode_cost.csv")
          assert set(p.episode_gap_h)=={0,12,24,48} and set(p.cost_bp)=={8,12,16,24}
          assert set(p.basket)=={5,10} and np.isfinite(p.event_pf).all()
          print("VERIFIED",len(p))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-episode-cost-VERIFIED, path: out/, if-no-files-found: error}
