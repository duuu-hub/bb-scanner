name: PSAR 1H PSAR-Anchor Heavy-File Signal Split
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1h_psar_anchor_heavy_signal_split_run']
permissions: {contents: read, actions: read}

jobs:
  part:
    strategy:
      fail-fast: false
      matrix:
        target: [233,716]
        part: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Build partition-only temporary engine
        run: |
          export ORIGINAL_ENGINE_BLOB_SHA=$(git hash-object scripts/psar_1h_psar_anchor_compare.py)
          python - <<'PY'
          p="scripts/psar_1h_psar_anchor_compare.py"
          s=open(p).read()
          s=s.replace("def evaluate(t,o,h,l,c,m,symbol=None):",
                      "def evaluate(t,o,h,l,c,m,symbol=None,signal_part=0,signal_parts=1):")
          s=s.replace("    for i in range(max(15,PSAR_BURNIN_BARS),n):\n",
                      "    for i in range(max(15,PSAR_BURNIN_BARS),n):\n        if (i-max(15,PSAR_BURNIN_BARS))%signal_parts!=signal_part:continue\n",1)
          s=s.replace('ap.add_argument("--max-files",type=int,default=0);a=ap.parse_args()',
                      'ap.add_argument("--max-files",type=int,default=0);ap.add_argument("--signal-part",type=int,default=0);ap.add_argument("--signal-parts",type=int,default=1);a=ap.parse_args()')
          s=s.replace('if a.shards<1 or a.shard<0 or a.shard>=a.shards:raise RuntimeError(f"invalid shard selection {a.shard}/{a.shards}")',
                      'if a.shards<1 or a.shard<0 or a.shard>=a.shards:raise RuntimeError(f"invalid shard selection {a.shard}/{a.shards}")\nif a.signal_parts<1 or a.signal_part<0 or a.signal_part>=a.signal_parts:raise RuntimeError("invalid signal partition")')
          s=s.replace("seg=evaluate(*part,m,sym)","seg=evaluate(*part,m,sym,a.signal_part,a.signal_parts)")
          open("/tmp/psar_anchor_signal_split.py","w").write(s)
          PY
          echo "$ORIGINAL_ENGINE_BLOB_SHA" > /tmp/original_engine_sha
      - name: Run exact signal partition
        run: |
          export PSAR_ENGINE_BLOB_SHA=$(cat /tmp/original_engine_sha)
          python /tmp/psar_anchor_signal_split.py --data data --tf 1h --shard ${{ matrix.target }} --shards 1024 --signal-part ${{ matrix.part }} --signal-parts 8 --out target_${{ matrix.target }}_part_${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1h-anchor-heavy-${{ matrix.target }}-part-${{ matrix.part }}
          path: target_${{ matrix.target }}_part_${{ matrix.part }}.json

  combine-heavy:
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: psar-1h-anchor-heavy-*
          path: parts
      - name: Combine disjoint signal partitions per heavy file
        run: |
          python - <<'PY'
          import glob,json,os
          for target in (233,716):
              fs=sorted(glob.glob(f"parts/psar-1h-anchor-heavy-{target}-part-*/*.json"))
              assert len(fs)==8,(target,fs)
              ds=[json.load(open(x)) for x in fs]
              assert all(d["files"]==1 and not d.get("errors") for d in ds)
              defs=[d["definition"] for d in ds]
              semdrop={"workflow_commit_sha"}
              def sem(d):return {k:v for k,v in d.items() if k not in semdrop}
              assert all(sem(d)==sem(defs[0]) for d in defs)
              derived={"win_pct","gross_pf_actual_R","gross_expectancy_actual_R"}
              agg={}
              for d in ds:
                  for k,v in d["summary"].items():
                      q=agg.setdefault(k,{kk:0 for kk in v if kk not in derived})
                      for kk,vv in v.items():
                          if kk not in derived:q[kk]+=vv
              for k,q in agg.items():
                  assert q["taker"]+q["maker"]==q["fills"]
                  assert q["win"]+q["loss"]+q["data_gap"]+q["exit_mismatch"]+q["unresolved_eod"]==q["fills"]
                  r=q["win"]+q["loss"]
                  q["win_pct"]=round(100*q["win"]/r,3) if r else None
                  q["gross_pf_actual_R"]=round(q["gross_profit_R"]/q["gross_loss_R"],5) if q["gross_loss_R"]>0 else None
                  q["gross_expectancy_actual_R"]=round((q["gross_profit_R"]-q["gross_loss_R"])/r,5) if r else None
              out={"definition":defs[0],"files":1,"errors":[],"summary":agg,
                   "signal_partition_proof":"8 disjoint strategy-bar residues modulo 8 over full original file; indicators/exits computed on full file"}
              json.dump(out,open(f"heavy_{target}_combined.json","w"),indent=2)
              print("HEAVY_COMBINE_PASS",target,len(agg))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1h-anchor-heavy-combined
          path: heavy_*_combined.json

  final-merge:
    needs: combine-heavy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download preserved successful components
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p old prior quarter subquarter finalsplit heavy
          for s in 0 2 5 6 7; do gh run download 36423641305 -R ${{ github.repository }} -n psar-1h-psar-anchor-$s -D old/$s; done
          for s in 1 4 11; do gh run download 36470586800 -R ${{ github.repository }} -n psar-1h-psar-anchor-recovery-$s -D prior/$s; done
          for s in 3 57 44 25 35 19 9 60 28; do gh run download 36507302707 -R ${{ github.repository }} -n psar-1h-psar-anchor-quarter-$s -D quarter/$s; done
          for s in 12 243 115 105 179 76 51 41 140 169; do gh run download 36544159103 -R ${{ github.repository }} -n psar-1h-psar-anchor-subquarter-$s -D subquarter/$s; done
          for s in 204 489 745 460 972 1001; do gh run download 36585876182 -R ${{ github.repository }} -n psar-1h-psar-anchor-finalsplit-$s -D finalsplit/$s; done
      - uses: actions/download-artifact@v4
        with:
          name: psar-1h-anchor-heavy-combined
          path: heavy
      - name: Final exact coverage merge
        run: |
          python - <<'PY'
          import glob,json
          fs=glob.glob("old/**/*.json",recursive=True)+glob.glob("prior/**/*.json",recursive=True)+glob.glob("quarter/**/*.json",recursive=True)+glob.glob("subquarter/**/*.json",recursive=True)+glob.glob("finalsplit/**/*.json",recursive=True)+glob.glob("heavy/**/*.json",recursive=True)
          assert len(fs)==35,(len(fs),fs)
          ds=[json.load(open(x)) for x in fs]
          assert all(not d.get("errors") for d in ds)
          expected={d["definition"]["input_files_total"] for d in ds};assert len(expected)==1,expected
          assert sum(d["files"] for d in ds)==next(iter(expected)),(sum(d["files"] for d in ds),expected)
          semantic_drop={"shard_index","shard_count","workflow_commit_sha"}
          def sem(d):return {k:v for k,v in d["definition"].items() if k not in semantic_drop}
          assert all(sem(d)==sem(ds[0]) for d in ds),"semantic definition mismatch"
          derived={"win_pct","gross_pf_actual_R","gross_expectancy_actual_R"}
          agg={}
          for d in ds:
              for k,v in d["summary"].items():
                  q=agg.setdefault(k,{kk:0 for kk in v if kk not in derived})
                  for kk,vv in v.items():
                      if kk not in derived:q[kk]+=vv
          for k,q in agg.items():
              assert q["taker"]+q["maker"]==q["fills"]
              assert q["win"]+q["loss"]+q["data_gap"]+q["exit_mismatch"]+q["unresolved_eod"]==q["fills"]
              r=q["win"]+q["loss"]
              q["win_pct"]=round(100*q["win"]/r,3) if r else None
              q["gross_pf_actual_R"]=round(q["gross_profit_R"]/q["gross_loss_R"],5) if q["gross_loss_R"]>0 else None
              q["gross_expectancy_actual_R"]=round((q["gross_profit_R"]-q["gross_loss_R"])/r,5) if r else None
          out={"definition":sem(ds[0]),"files":sum(d["files"] for d in ds),"summary":agg,
               "coverage":"exact all input files; final heavy files 233/1024 and 716/1024 signal-partitioned 8 ways"}
          json.dump(out,open("psar_1h_anchor_FINAL.json","w"),indent=2)
          print("ANCHOR_FINAL_PASS",out["files"],len(agg))
          top=sorted(((q["gross_pf_actual_R"] or -1,k,q["gross_expectancy_actual_R"],q["win_pct"],q["fills"],q["taker"],q["maker"]) for k,q in agg.items()),reverse=True)[:30]
          for row in top:print("TOP",row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1h-anchor-FINAL
          path: psar_1h_anchor_FINAL.json
