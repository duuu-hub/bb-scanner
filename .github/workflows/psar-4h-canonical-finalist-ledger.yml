name: PSAR 4H Canonical Finalist Ledger
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_canonical_finalist_ledger_run']
permissions: {contents: read, actions: read}
jobs:
  ledger:
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Run canonical finalist ledger
        run: |
          export PSAR_SOURCE_BLOB=$(git hash-object scripts/psar_4h_canonical_compare.py)
          python scripts/psar_4h_canonical_finalist_ledger.py --data data --shard ${{ matrix.shard }} --shards 8 --events events_${{ matrix.shard }}.csv.gz --meta meta_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-canonical-finalist-ledger-${{ matrix.shard }}
          path: |
            events_${{ matrix.shard }}.csv.gz
            meta_${{ matrix.shard }}.json
