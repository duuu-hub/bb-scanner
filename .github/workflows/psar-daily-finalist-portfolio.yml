name: PSAR Daily Finalist Portfolio Validation
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_daily_portfolio_run']
permissions: {contents: read, actions: read}
jobs:
  scan:
    strategy: {fail-fast: false, matrix: {shard: [0,1,2,3,4,5,6,7]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - run: python scripts/psar_daily_approach_breakout.py --data data --shard ${{ matrix.shard }} --shards 8 --out approach_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with: {name: 'psar-daily-approach-${{ matrix.shard }}', path: 'approach_${{ matrix.shard }}.json'}
  merge:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'psar-daily-approach-*', path: x}
      - run: |
          python - <<'PY'
          import glob,json
          ev=sum((json.load(open(p))['events'] for p in glob.glob('x/**/*.json',recursive=True)),[])
          cuts=[.05,.1,.2,.3,.5,.75,1,1.5,2,2.5,3]; hrs=[6,12,24,48,72,120,168]; out=[]
          for d in cuts:
            q=[x for x in ev if x['dist_atr']<=d]
            for h in hrs:
              hits=[x for x in q if x[f'hit_{h}h']]
              out.append({'dist_atr_le':d,'hours':h,'n':len(q),'hit_pct':100*len(hits)/len(q) if q else None,'mae_avg_atr':sum(x[f'mae_{h}h'] for x in q)/len(q) if q else None,'mfe_after_break_avg_atr':sum(x[f'mfe_{h}h'] for x in hits)/len(hits) if hits else None})
          json.dump(out,open('approach_summary.json','w'),indent=2)
          for z in out: print('SCAN',z)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: psar-daily-approach-summary, path: approach_summary.json}
