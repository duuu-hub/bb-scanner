name: PSAR Daily Finalist Portfolio Validation
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_daily_portfolio_run']
permissions: {contents: read, actions: read}
jobs:
  scan:
    strategy: {fail-fast: false, matrix: {shard: [0,1,2,3,4,5,6,7]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: 30-check validation gate
        run: python scripts/validate_psar_approach_30.py
      - run: python scripts/psar_4h_approach_long.py --data data --shard ${{ matrix.shard }} --shards 8 --out long_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with: {name: 'psar-4h-intrabar-long-${{ matrix.shard }}', path: 'long_${{ matrix.shard }}.json'}
  merge:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'psar-4h-intrabar-long-*', path: x}
      - run: |
          python - <<'PY'
          import glob,json
          z={}
          for p in glob.glob('x/**/*.json',recursive=True):
            for k,v in json.load(open(p)).items():
              q=z.setdefault(k,{'n':0,'win':0,'loss':0,'timeout':0,'sumR':0.})
              for a in q:q[a]+=v[a]
          rows=[]
          for k,q in z.items():
            n=q['n']; ev=q['sumR']/n if n else 0; wr=100*q['win']/n if n else 0
            rows.append((ev,k,n,wr,q['win'],q['loss'],q['timeout']))
          rows.sort(reverse=True)
          json.dump(rows,open('approach_4h_intrabar_long_summary.json','w'),indent=2)
          for r in rows[:80]:print('TOP',r)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: psar-4h-intrabar-long-summary, path: approach_4h_intrabar_long_summary.json}
