name: Pre2024 Fast Causal
on:
  push:
    branches: [research-liquid-smc]
    paths:
      - "research/pre2024_fast.py"
      - ".github/workflows/pre2024-fast.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-liquid-smc, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-backtest.txt
      - run: python -m research.pre2024_fast
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/pre2024_fast
          git commit -m "research: persist fast pre2024 causal results"
          git pull --rebase origin research-liquid-smc
          git push origin HEAD:research-liquid-smc
