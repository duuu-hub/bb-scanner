name: VWAP Mature Age Audit
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: [.research/vwap_mature_age_run]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ev cov
          gh run download 36735084022 -n vwap20-btc-bull-alt-down-5y-results -D ev
          for i in 0 1 2 3 4 5 6 7; do mkdir -p cov/$i; gh run download 36740950910 -n count-audit-$i -D cov/$i; done
      - run: python scripts/vwap20_mature_age_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: vwap-mature-age-results
          path: age_summary.csv
