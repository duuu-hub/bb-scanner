name: Open Outside BB Canonical

on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/open_outside_bb_canonical.py'
      - '.github/workflows/open-outside-bb-canonical.yml'

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen raw shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw
      - run: |
          rm -rf out
          PYTHONPATH=scripts python scripts/open_outside_bb_canonical.py --raw raw --out out
      - uses: actions/upload-artifact@v4
        with:
          name: open-outside-bb-canon-partial-${{ matrix.shard }}
          path: out/canonical.csv
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: open-outside-bb-canon-partial-*
          path: partials
      - name: Merge canonical stats
        run: |
          python - <<'PY'
          import glob,pandas as pd,os
          fs=glob.glob('partials/**/canonical.csv',recursive=True)
          z=pd.concat([pd.read_csv(f) for f in fs],ignore_index=True)
          keys=['fresh_atleast','min_target_dist_pct','stop_pct','hold_h','segment']
          sums=['n','wins','gross','gp20','gl20','gp40','gl40','tp','sl','time','entry1m','dist']
          m=z.groupby(keys,as_index=False)[sums].sum()
          m['wr_pct']=m.wins/m.n*100
          m['avg_gross_pct']=m.gross/m.n
          m['avg_target_dist_pct']=m.dist/m.n
          m['pf20']=m.gp20/m.gl20
          m['pf40']=m.gp40/m.gl40
          m['tp_pct']=m.tp/m.n*100
          m['sl_pct']=m.sl/m.n*100
          m['time_pct']=m.time/m.n*100
          m['entry1m_loss_pct']=m.entry1m/m.n*100
          os.makedirs('merged',exist_ok=True)
          m.to_csv('merged/canonical_merged.csv',index=False)
          print("=== TRAIN TOP PF20 ===")
          print(m[m.segment.eq('TRAIN')].sort_values('pf20',ascending=False).head(15).to_string(index=False))
          print("=== SEEN TOP PF20 ===")
          print(m[m.segment.eq('SEEN')].sort_values('pf20',ascending=False).head(15).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-outside-bb-canonical-merged-${{ github.run_id }}
          path: merged/canonical_merged.csv
          retention-days: 30
