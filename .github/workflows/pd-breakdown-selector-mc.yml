name: PD Breakdown Selector Monte Carlo
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_selector_mc_once']
permissions: {contents: read, actions: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_selector_mc.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36095439671, pattern: rank5-binance-um-15m-5y-*, path: data, merge-multiple: true}
      - run: python research/pd_breakdown_selector_mc.py --input data --trades trades/trades_all.csv --wf wf/walkforward.csv --out out --sims 3000
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np
          a=pd.read_csv("out/annual.csv");m=pd.read_csv("out/monte_carlo.csv")
          assert set(a.year)=={2023,2024,2025,2026} and len(a)==16
          assert (m.sims==3000).all() and set(m.basket)=={5,10} and np.isfinite(m.random_pf_mean).all()
          print("VERIFIED",len(a),len(m))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-selector-mc-VERIFIED, path: out/, if-no-files-found: error}
