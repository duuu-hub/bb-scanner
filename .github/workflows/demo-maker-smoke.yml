name: Demo Maker Smoke
on:
  push:
    branches: [main]
    paths:
      - 'maker_demo_smoke.py'
      - '.github/workflows/demo-maker-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Place and cancel one far-away Demo maker order
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          DEMO_CONFIRM: MAKER_POST_ONLY_SMOKE
        run: python maker_demo_smoke.py
