name: PD Breakdown Core Off Complement
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: [".research/pd_breakdown_core_off_once"]
permissions:
  actions: read
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36278658727
          name: pd-breakdown-selector-risk-portfolio-VERIFIED
          path: pd
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35952730823
          name: btc-eth-regime-stage5-long-history
          path: core
      - run: ls -R pd core | head -100
      - run: python research/pd_breakdown_core_off.py
      - run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/core_off_summary.csv")
          assert set(s.segment)=={"CORE_OFF","CORE_ON"}
          assert s.events.sum()==42
          print(s.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pd-breakdown-core-off-complement-VERIFIED
          path: out/
          if-no-files-found: error
