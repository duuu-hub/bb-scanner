name: VWAP20 Mature Coin Age Audit
on:
 push:
  branches: [research-rank5-binance-15m-5y]
  paths: ['.research/vwap20_mature_age_audit_run']
jobs:
 audit:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install pandas numpy
   - env: {GH_TOKEN: '${{ github.token }}'}
     run: |
      mkdir -p ev cov
      gh run download 36735084022 -R ${{ github.repository }} -n vwap20-btc-bull-alt-down-5y-results -D ev
      for i in 0 1 2 3 4 5 6 7; do gh run download 36740950910 -R ${{ github.repository }} -n count-audit-$i -D cov/$i; done
   - run: |
      python - <<'PY'
      import pandas as pd,glob,numpy as np,os
      e=pd.read_csv('ev/events_all.csv')
      c=pd.concat([pd.read_csv(x) for x in glob.glob('cov/*/coverage.csv')],ignore_index=True)
      first=c.groupby('symbol').first_date.min()
      e['first_date']=e.symbol.map(first)
      e['age_days']=(pd.to_datetime(e.date)-pd.to_datetime(e.first_date)).dt.days
      def pf(y):
       p=y[y>0].sum(); n=-y[y<0].sum()
       return p/n if n>0 else np.inf
      rows=[]
      buckets=[('ALL',e),('AGE_GE_90',e[e.age_days>=90]),('AGE_GE_180',e[e.age_days>=180]),('AGE_GE_365',e[e.age_days>=365]),('AGE_GE_730',e[e.age_days>=730])]
      for b,d in buckets:
       for sp,g in [('ALL',d),('TRAIN',d[d.year<=2024]),('HOLDOUT',d[d.year>=2025]),('2025',d[d.year==2025])]:
        for cost in [0,.2,.4]:
         y=g.gross_pct-cost
         rows.append([b,sp,cost,len(g),(y>0).mean()*100 if len(y) else np.nan,y.mean() if len(y) else np.nan,pf(y) if len(y) else np.nan])
      out=pd.DataFrame(rows,columns=['age_filter','split','cost_pct','n','wr_pct','mean_pct','pf'])
      out.to_csv('age_summary.csv',index=False); e.to_csv('events_with_age.csv',index=False)
      print(out.to_string(index=False))
      print('MISSING_AGE',e.age_days.isna().sum(),'NEG_AGE',(e.age_days<0).sum())
      PY
   - uses: actions/upload-artifact@v4
     with: {name: vwap20-mature-age-audit-results, path: '*.csv'}
