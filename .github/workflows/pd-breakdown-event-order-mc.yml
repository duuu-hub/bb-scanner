name: PD Breakdown Event Order MC
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_event_order_mc_once']
permissions: {contents: read, actions: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - run: python research/pd_breakdown_event_order_mc.py --trades trades/trades_all.csv --wf wf/walkforward.csv --out out --sims 10000
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np
          r=pd.read_csv("out/mc_summary.csv")
          assert len(r)==10 and set(r.cost_bp)=={8,24} and set(np.round(r.risk,2))=={.02,.03,.04,.05,.06}
          assert (r.mdd_p99>=r.mdd_p95).all() and (r.mdd_p95>=r.mdd_median).all()
          print("VERIFIED",len(r),int(r.sims.min()))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-event-order-mc-VERIFIED, path: out/, if-no-files-found: error}
