name: Premium Absorption V8 Research Cycle
'on':
  push:
    branches:
    - research-premium-absorption-v8
    paths:
    - .research/premium-absorption-v8-run
permissions:
  contents: read
  actions: read
concurrency:
  group: premium-absorption-v8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
    - name: Validate causal inputs, chronological exits and account observations
      shell: bash
      run: 'set -euo pipefail

        python -m py_compile scripts/premium_absorption_v8.py scripts/premium_index_archive.py scripts/official_minute_provenance.py
        scripts/day_edge_canonical.py scripts/research_evidence_archive.py

        python - <<''PY''

        import json

        p=''research/premium-absorption-v8/FROZEN_INPUT_HASHES.json''

        d=json.load(open(p))

        assert d[''source_data_run'']==36095439671

        assert len(d[''expected_csv_sha256''])==256

        assert all(len(k)==64 for k in d[''expected_csv_sha256''].values())

        print(''FROZEN_INPUT_BASELINE_PASS'',len(d[''expected_csv_sha256'']))

        PY

        python -m unittest discover -s tests -p test_premium_absorption_v8.py -v 2>&1 | tee premium-tests.log

        python -m unittest discover -s tests -p test_funding_crowding_v7.py -v 2>&1 | tee funding-regression-tests.log


        python -m unittest discover -s tests -p test_btc_factor_lag_v6.py -v 2>&1 | tee factor-tests.log

        python -m unittest discover -s tests -p test_liquidity_sweep_v5.py -v 2>&1 | tee minute-provenance-regressions.log

        python -m unittest discover -s tests -p test_research_evidence_archive.py -v 2>&1 | tee evidence-tests.log

        python -m unittest discover -s tests -p test_shock_confirmation_v3.py -v 2>&1 | tee legacy-confirm-tests.log

        python -m unittest discover -s tests -p test_day_edge_canonical.py -v 2>&1 | tee canonical-tests.log

        python -m unittest discover -s tests -p test_day_edge_lab.py -v 2>&1 | tee scout-tests.log

        python -m unittest discover -s tests -p test_relative_pullback_v1.py -v 2>&1 | tee account-tests.log

        python scripts/psar_chronology_smoke.py | tee chronology-smoke.log

        '
    - name: Verify original official premium-index ZIP and actual monthly schema before DEV
      run: 'set -euo pipefail

        python scripts/premium_index_archive.py --probe-symbol BTCUSDT --probe-month 2022-01 --cache cache/premium-probe
        --out premium-probe 2>&1 | tee premium-probe.log'
      shell: bash
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-validation
        path: 'factor-tests.log

          evidence-tests.log

          legacy-confirm-tests.log

          canonical-tests.log

          scout-tests.log

          account-tests.log

          chronology-smoke.log

          research/premium-absorption-v8/PLAN.md

          research/premium-absorption-v8/FROZEN_INPUT_HASHES.json

          research/premium-absorption-v8/ATTEMPT_1_SOURCE_FAILURE.json


          minute-provenance-regressions.log


          premium-tests.log

          funding-regression-tests.log

          premium-probe.log

          premium-probe/

          '
        retention-days: 30
  development:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: premium-absorption-v8-dev-1m-shard-${{ matrix.shard }}
        restore-keys: 'factor-lag-v6-dev-1m-shard-${{ matrix.shard }}

          liquidity-v5-dev-1m-shard-${{ matrix.shard }}'
    - uses: actions/cache@v4
      with:
        path: cache/verified-premium
        key: premium-absorption-v8-dev-premium-shard-${{ matrix.shard }}
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Download immutable market shard
      if: steps.source-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard
        }} -D data
    - name: BTC context
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
    - name: Verify full frozen catalogue and previous SHA256 inputs
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{
        matrix.shard }} -D source-manifest

        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline
        research/premium-absorption-v8/FROZEN_INPUT_HASHES.json --out dev-${{ matrix.shard }}/source_check.json

        '
    - name: All frozen V8 DEV policies with official closed premium-index normalization and canonical chronology
      run: python scripts/premium_absorption_v8.py scan --stage DEV --data data --btc btc/BTCUSDT.csv.gz --out dev-${{
        matrix.shard }} --minute-cache cache/verified-1m --premium-cache cache/verified-premium
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-dev-${{ matrix.shard }}
        path: dev-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
  selection:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      selected_count: ${{ steps.pick.outputs.selected_count }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        pattern: premium-absorption-v8-dev-[0-7]
        path: dev-parts
    - name: Freeze development-only selection
      id: pick
      run: 'python scripts/premium_absorption_v8.py select --parts dev-parts --out selected-input

        python - <<''PY''

        import json,os

        n=len(json.load(open(''selected-input/selection.json''))[''policies''])

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as f:f.write(''selected_count=''+str(n)+''\n'')

        PY

        '
    - name: Preserve development evidence even when there is no survivor
      env:
        RESULT_BRANCH: research-premium-absorption-v8-dev-${{ github.run_id }}
      run: "python - <<'PY'\nfrom pathlib import Path\nimport shutil,json,os,hashlib\ndest=Path('research/premium-absorption-v8')/('run-'+os.environ['GITHUB_RUN_ID'])/'development'\n\
        shutil.copytree('selected-input',dest)\nfor i,p in enumerate(sorted(Path('dev-parts').rglob('scan_meta.json'))):\n\
        \  shutil.copyfile(p,dest/f'full_dev_shard_{i}_meta.json')\nfor i,p in enumerate(sorted(Path('dev-parts').rglob('exclusions.csv'))):\n\
        \  shutil.copyfile(p,dest/f'full_dev_shard_{i}_exclusions.csv')\n(dest/'provenance.json').write_text(json.dumps(dict(\n\
        \  run=int(os.environ['GITHUB_RUN_ID']),executed_commit=os.environ['GITHUB_SHA'],\n  source_data_run=36095439671,policy_trials=96,\n\
        \  sha256={str(p.relative_to(dest)):hashlib.sha256(p.read_bytes()).hexdigest()\n          for p in dest.rglob('*')\
        \ if p.is_file()}),indent=2))\nPY\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"\
        41898282+github-actions[bot]@users.noreply.github.com\"\ngit checkout -b \"$RESULT_BRANCH\"\ngit add \"\
        research/premium-absorption-v8/run-${{ github.run_id }}\"\ngit commit -m \"Preserve V8 development selection\
        \ and all policy diagnostics\"\ngit push origin \"$RESULT_BRANCH\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-selected
        path: selected-input/
        retention-days: 30
        compression-level: 0
  gate:
    needs: selection
    if: needs.selection.outputs.selected_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: premium-absorption-v8-gate-1m-shard-${{ matrix.shard }}
        restore-keys: 'factor-lag-v6-gate-1m-shard-${{ matrix.shard }}

          liquidity-v5-dev-1m-shard-${{ matrix.shard }}'
    - uses: actions/cache@v4
      with:
        path: cache/verified-premium
        key: premium-absorption-v8-gate-premium-shard-${{ matrix.shard }}
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Frozen source and BTC
      env:
        GH_TOKEN: ${{ github.token }}
      run: "if [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then\n  gh run download 36095439671\
        \ -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data\nfi\ngh\
        \ run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc\n"
    - uses: actions/download-artifact@v4
      with:
        name: premium-absorption-v8-selected
        path: selected-input
    - name: Verify GATE uses the same complete original source
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{
        matrix.shard }} -D source-manifest

        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline
        research/premium-absorption-v8/FROZEN_INPUT_HASHES.json --out gate-${{ matrix.shard }}/source_check.json

        '
    - name: All frozen V8 GATE policies with official closed premium-index normalization and canonical chronology
      run: python scripts/premium_absorption_v8.py scan --stage GATE --data data --btc btc/BTCUSDT.csv.gz --selection
        selected-input/selection.json --out gate-${{ matrix.shard }} --minute-cache cache/verified-1m --premium-cache
        cache/verified-premium
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-gate-${{ matrix.shard }}
        path: gate-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
  accounts:
    needs:
    - selection
    - gate
    if: needs.selection.outputs.selected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        name: premium-absorption-v8-selected
        path: combined-parts
    - uses: actions/download-artifact@v4
      with:
        pattern: premium-absorption-v8-gate-[0-7]
        path: combined-parts/gate
    - name: Frozen account marking source
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D
        market
    - name: Verify all eight account marking source shards
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh run download 36095439671 -R ${{ github.repository }} -p ''rank5-binance-um-15m-5y-manifest-shard-*''
        -D source-manifests

        python scripts/research_evidence_archive.py verify-source --data market --manifests source-manifests --expected-shards
        8 --baseline research/premium-absorption-v8/FROZEN_INPUT_HASHES.json --out premium-account/source_check.json

        '
    - name: Actual account growth, daily goals and arithmetic audit
      run: python scripts/day_edge_canonical.py accounts --data market --parts combined-parts --out premium-account
        --selection combined-parts/selection.json --expected-shards 16 --all-kst-days
    - name: Preserve complete account results on a separate result branch
      env:
        RESULT_BRANCH: research-premium-absorption-v8-results-${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: "python - <<'PY'\nfrom pathlib import Path\nimport shutil,json,hashlib,os,pandas as pd\ndest=Path('research/premium-absorption-v8')/('run-'+os.environ['GITHUB_RUN_ID'])/'accounts'\n\
        dest.mkdir(parents=True)\nfor name in ['summary.csv','summary.json','year_quarter.csv','audit.json',\n \
        \            'survivors.json','independent_candidates.csv.gz']:\n  shutil.copyfile(Path('premium-account')/name,dest/name)\n\
        shutil.copyfile('combined-parts/selection.json',dest/'selection.json')\nshutil.copyfile('combined-parts/development_policy_cells.csv',dest/'development_policy_cells.csv')\n\
        for i,p in enumerate(sorted(Path('combined-parts').rglob('scan_meta.json'))):\n  shutil.copyfile(p,dest/f'scan_shard_{i}_meta.json')\n\
        for i,p in enumerate(sorted(Path('combined-parts/gate').rglob('exclusions.csv'))):\n  shutil.copyfile(p,dest/f'gate_shard_{i}_exclusions.csv')\n\
        rows=[]\nfor p in Path('premium-account/details').glob('*/trades.csv.gz'):\n  try:d=pd.read_csv(p)\n  except\
        \ pd.errors.EmptyDataError:continue\n  d['scenario']=p.parent.name;rows.append(d)\nif rows:pd.concat(rows,ignore_index=True).to_csv(dest/'executed_trades.csv.gz',index=False,compression='gzip')\n\
        (dest/'provenance.json').write_text(json.dumps(dict(\n  run=int(os.environ['GITHUB_RUN_ID']),executed_commit=os.environ['GITHUB_SHA'],\n\
        \  source_data_run=36095439671,\n  sha256={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.iterdir()\
        \ if p.is_file()}),indent=2))\nPY\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"\
        41898282+github-actions[bot]@users.noreply.github.com\"\ngit checkout -b \"$RESULT_BRANCH\"\ngit add \"\
        research/premium-absorption-v8/run-${{ github.run_id }}\"\ngit commit -m \"Preserve V8 constrained account\
        \ results and rejected policies\"\ngit push origin \"$RESULT_BRANCH\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-account-summary
        path: research/premium-absorption-v8/run-${{ github.run_id }}/accounts/
        retention-days: 30
        compression-level: 0
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premium-absorption-v8-account-details
        path: premium-account/
        retention-days: 30
        compression-level: 0
  preserve_cycle:
    needs:
    - validate
    - development
    - selection
    - gate
    - accounts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pandas==2.3.3
    - name: Collect all completed and failed current-stage evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'premium-absorption-v8-*'\
        \ -D cycle-evidence\ngh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100\
        \ > cycle-evidence/actions-jobs.json\nmkdir -p cycle-evidence/job-logs\npython - <<'PY' > completed-jobs.txt\n\
        import json\nfor j in json.load(open('cycle-evidence/actions-jobs.json'))['jobs']:\n    if j['status']=='completed'\
        \ and j['conclusion']!='skipped': print(j['id'])\nPY\nwhile read job_id; do\n  gh api --allow-escape-sequences\
        \ repos/${{ github.repository }}/actions/jobs/$job_id/logs > cycle-evidence/job-logs/$job_id.log\ndone <\
        \ completed-jobs.txt\ncp research/premium-absorption-v8/PLAN.md cycle-evidence/FROZEN_PLAN.md\ncp research/premium-absorption-v8/FROZEN_INPUT_HASHES.json\
        \ cycle-evidence/\n"
    - name: Preserve full V8 ledgers, curves, partial failures and hashes
      env:
        RESULT_BRANCH: research-premium-absorption-v8-evidence-${{ github.run_id }}
      run: 'python scripts/research_evidence_archive.py archive --source cycle-evidence --kind V8-complete-or-partial
        --out research/premium-absorption-v8/run-${{ github.run_id }}/complete-evidence

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "$RESULT_BRANCH"

        git add "research/premium-absorption-v8/run-${{ github.run_id }}/complete-evidence"

        git commit -m "Preserve V8 complete original trials, account details, validation and partial failures"

        git push origin "$RESULT_BRANCH"

        '
