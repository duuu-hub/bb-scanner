name: PD Breakdown Dynamic Breadth Risk
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_dynamic_breadth_risk_once']
permissions: {contents: read, actions: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - run: python research/pd_breakdown_dynamic_breadth_risk.py --trades trades/trades_all.csv --wf wf/walkforward.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np
          r=pd.read_csv("out/dynamic_risk_compare.csv")
          assert len(r)==16 and r.scheme.nunique()==8 and set(r.cost_bp)=={8,24}
          assert np.isfinite(r[["final_equity","mdd","return_mdd"]]).all().all()
          print("VERIFIED",len(r))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-dynamic-breadth-risk-VERIFIED, path: out/, if-no-files-found: error}
