name: Bitget RWA vs CME Overlap Fast

on:
  push:
    branches:
      - research-liquid-smc
    paths:
      - "research/bitget_rwa_overlap.py"
      - ".github/workflows/bitget-rwa-overlap-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-liquid-smc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-backtest.txt
          pip install yfinance
      - run: python -m research.bitget_rwa_overlap
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/bitget_rwa_overlap
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist fast Bitget RWA overlap results"
          git pull --rebase origin research-liquid-smc
          git push origin HEAD:research-liquid-smc
