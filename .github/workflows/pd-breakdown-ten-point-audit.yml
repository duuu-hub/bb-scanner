name: PD Breakdown Ten Point Audit
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_ten_point_audit_once']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: |
          python -m py_compile research/pd_breakdown_short_4h.py
          python -m py_compile research/pd_breakdown_ten_point_audit.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36159685183
          name: pd-4h-breakdown-short-VERIFIED
          path: trades
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36211084008
          name: pd-breakdown-walkforward-basket-VERIFIED
          path: wf
      - run: python research/pd_breakdown_ten_point_audit.py --trades trades/trades_all.csv --wf wf/walkforward.csv --out out
      - uses: actions/upload-artifact@v4
        with:
          name: pd-breakdown-ten-point-audit
          path: out/
          if-no-files-found: error
