name: LONG3 Relative Strength Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [research-long3-relative-strength]
    paths:
      - 'research/long3_relative_strength.py'
      - '.github/workflows/long3-relative-strength.yml'
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-backtest.txt
      - name: Download frozen precision result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p precision_source
          gh run download 35584621765 -n precision-backtest-results -D precision_source
          ls -lah precision_source
      - name: Run relative-strength diagnostic
        run: |
          python research/long3_relative_strength.py \
            --source precision_source/snapshots.csv.gz \
            --trades precision_source/trades.csv.gz
      - name: Print results
        if: always()
        run: |
          cat research/results/long3_relative_strength/meta.json || true
          cat research/results/long3_relative_strength/summary.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long3-relative-strength-results
          path: research/results/long3_relative_strength/
