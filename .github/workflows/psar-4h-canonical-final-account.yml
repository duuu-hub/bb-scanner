name: PSAR 4H Canonical Final Account
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_canonical_final_account_run']
permissions: {contents: read, actions: read}
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download canonical ledger
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p ledger
          gh run download 36519239563 -R ${{ github.repository }} -p 'psar-4h-canonical-finalist-ledger-*' -D ledger
      - name: Download setup-count shards
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p sizing
          gh run download 36437560302 -R ${{ github.repository }} -p 'psar-4h-short-sizing-*' -D sizing
      - name: Download BTC source shard
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p data
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-3' -D data
      - name: Final account sweep
        run: python scripts/psar_4h_canonical_final_account.py --ledger ledger --sizing sizing --data data --out final_account.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-canonical-final-account
          path: final_account.json
