name: AOA Market Context Research

on:
  push:
    branches: [research-aoa-market-context]
    paths:
      - "research/aoa_market_context/**"
      - ".github/workflows/aoa-market-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pandas numpy scikit-learn
      - name: Analyze AOA decisions against user BTCUSDT candles
        run: python research/aoa_market_context/analyze_market_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoa-market-context-results
          path: research/aoa_market_context/output/
          retention-days: 30
