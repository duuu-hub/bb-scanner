name: Session VWAP Failed Auction V17 Research Cycle
'on':
  push:
    branches:
    - research-session-vwap-failed-auction-v17
    paths:
    - .research/session-vwap-failed-auction-v17-run
permissions:
  contents: read
  actions: read
concurrency:
  group: session-vwap-failed-auction-v17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1'
    - name: Session VWAP failed-auction causality and canonical account validation
      shell: bash
      run: |
        set -euo pipefail
        python -m py_compile scripts/session_vwap_failed_auction_v17.py scripts/validate_session_vwap_failed_auction_v17.py scripts/official_minute_provenance.py scripts/day_edge_canonical.py scripts/research_evidence_archive.py
        python scripts/validate_session_vwap_failed_auction_v17.py 2>&1 | tee v17-tests.log
        python scripts/psar_chronology_smoke.py 2>&1 | tee chronology-smoke.log
        python scripts/session_vwap_failed_auction_v17.py smoke --out synthetic-v17 2>&1 | tee session-vwap-pipeline-smoke.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: session-vwap-failed-auction-v17-validation
        path: 'v17-tests.log

          chronology-smoke.log

          session-vwap-pipeline-smoke.log

          synthetic-v17/

          research/session-vwap-failed-auction-v17/'
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3'
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: "set -euo pipefail\nif [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then\n  gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data\nfi\ngh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc\ngh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest\npython scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/session-vwap-failed-auction-v17/FROZEN_INPUT_HASHES.json --out source-check.json"
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: session-vwap-failed-auction-v17-dev-1m-shard-${{ matrix.shard }}
        restore-keys: 'taker-absorption-release-v12-dev-1m-shard-${{ matrix.shard }}

          aggressive-flow-cascade-v11-dev-1m-shard-${{ matrix.shard }}

          residual-reversion-v10-dev-1m-shard-${{ matrix.shard }}

          cross-sectional-leader-v9-dev-1m-shard-${{ matrix.shard }}

          premium-absorption-v8-dev-1m-shard-${{ matrix.shard }}

          factor-lag-v6-dev-1m-shard-${{ matrix.shard }}'
    - name: Canonical scan of frozen session VWAP failed-auction reversal
      shell: bash
      run: 'set -euo pipefail

        python scripts/session_vwap_failed_auction_v17.py scan --stage DEV --data data --btc btc/BTCUSDT.csv.gz --source-check source-check.json --out dev-${{ matrix.shard }} --minute-cache cache/verified-1m'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: session-vwap-failed-auction-v17-dev-${{ matrix.shard }}
        path: dev-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3'
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: "set -euo pipefail\nif [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then\n  gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data\nfi\ngh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc\ngh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest\npython scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/session-vwap-failed-auction-v17/FROZEN_INPUT_HASHES.json --out source-check.json"
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: session-vwap-failed-auction-v17-gate-1m-shard-${{ matrix.shard }}
        restore-keys: 'aggressive-flow-cascade-v11-gate-1m-shard-${{ matrix.shard }}

          residual-reversion-v10-gate-1m-shard-${{ matrix.shard }}

          cross-sectional-leader-v9-gate-1m-shard-${{ matrix.shard }}

          premium-absorption-v8-gate-1m-shard-${{ matrix.shard }}

          factor-lag-v6-gate-1m-shard-${{ matrix.shard }}'
    - uses: actions/download-artifact@v4
      with:
        name: session-vwap-failed-auction-v17-selected
        path: selected-input
    - name: Canonical scan of frozen session VWAP failed-auction reversal
      shell: bash
      run: 'set -euo pipefail

        python scripts/session_vwap_failed_auction_v17.py scan --stage GATE --data data --btc btc/BTCUSDT.csv.gz --source-check source-check.json --out gate-${{ matrix.shard }} --minute-cache cache/verified-1m --selection selected-input/selection.json'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: session-vwap-failed-auction-v17-gate-${{ matrix.shard }}
        path: gate-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    if: needs.selection.outputs.selected_count != '0'
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3'
    - uses: actions/download-artifact@v4
      with:
        pattern: session-vwap-failed-auction-v17-dev-[0-7]
        path: dev-parts
    - name: Freeze DEV selection before gate data processing
      shell: bash
      run: 'set -euo pipefail

        python scripts/session_vwap_failed_auction_v17.py select --parts dev-parts --out selected-input

        python - <<''SELECT''

        import json,os

        n=len(json.load(open(''selected-input/selection.json''))[''policies''])

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as f:f.write(''selected_count=''+str(n)+''\n'')

        SELECT

        '
      id: pick
    - name: Preserve all cells, complete shard diagnostics and exclusion counts
      shell: bash
      run: "set -euo pipefail\npython - <<'SAVE'\nfrom pathlib import Path\nimport shutil,json,os,hashlib\np=Path('research/session-vwap-failed-auction-v17/run-'+os.environ['GITHUB_RUN_ID']+'/development')\nshutil.copytree('selected-input',p)\nfor name in ['scan_meta.json','exclusions.csv','frozen_context.json','source_check.json']:\n for i,f in enumerate(sorted(Path('dev-parts').rglob(name))):\n  shutil.copyfile(f,p/('full_dev_shard_'+str(i)+'_'+name))\n(p/'provenance.json').write_text(json.dumps(dict(run=int(os.environ['GITHUB_RUN_ID']),code_commit=os.environ['GITHUB_SHA'],\n source_data_run=36095439671,cells=96,sha256={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()}),indent=2))\nSAVE\n"
    - name: Preserve dev on a separate research branch
      shell: bash
      run: 'set -euo pipefail

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "research-session-vwap-failed-auction-v17-dev-${{ github.run_id }}"

        git add "research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/development"

        git commit -m "Preserve V17 dev before subsequent research stages"

        git push origin HEAD

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: session-vwap-failed-auction-v17-selected
        path: selected-input/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: development
    permissions:
      contents: write
      actions: read
    outputs:
      selected_count: ${{ steps.pick.outputs.selected_count }}
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3'
    - uses: actions/download-artifact@v4
      with:
        name: session-vwap-failed-auction-v17-selected
        path: combined-parts
    - uses: actions/download-artifact@v4
      with:
        pattern: session-vwap-failed-auction-v17-gate-[0-7]
        path: combined-parts/gate
    - name: Verify same full account marking universe
      shell: bash
      run: 'set -euo pipefail

        gh run download 36095439671 -R ${{ github.repository }} -p ''rank5-binance-um-15m-5y-data-shard-*'' -D market

        gh run download 36095439671 -R ${{ github.repository }} -p ''rank5-binance-um-15m-5y-manifest-shard-*'' -D source-manifests

        python scripts/research_evidence_archive.py verify-source --data market --manifests source-manifests --expected-shards 8 --baseline research/session-vwap-failed-auction-v17/FROZEN_INPUT_HASHES.json --out session-vwap-account/source_check.json

        python scripts/session_vwap_failed_auction_v17.py accounts --data market --parts combined-parts --out session-vwap-account --selection combined-parts/selection.json

        '
    - name: Save account arithmetic, all calendar days, curves and source hashes
      shell: bash
      run: 'set -euo pipefail

        mkdir -p research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/accounts

        cp -r session-vwap-account/. research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/accounts/

        cp combined-parts/selection.json research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/accounts/

        cp combined-parts/development_policy_cells.csv research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/accounts/'
    - name: Preserve results on a separate research branch
      shell: bash
      run: 'set -euo pipefail

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "research-session-vwap-failed-auction-v17-results-${{ github.run_id }}"

        git add "research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/accounts"

        git commit -m "Preserve V17 results before subsequent research stages"

        git push origin HEAD

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: session-vwap-failed-auction-v17-account-details
        path: session-vwap-account/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs:
    - selection
    - gate
    permissions:
      contents: write
      actions: read
    if: needs.selection.outputs.selected_count != '0'
  preserve_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: 'set -euo pipefail

        pip install pandas==2.3.3 numpy==2.3.3'
    - name: Collect completed and failed evidence with actual Actions logs
      shell: bash
      run: "set -euo pipefail\nmkdir -p cycle-evidence/job-logs\nif ! gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'session-vwap-failed-auction-v17-*' -D cycle-evidence; then\n  echo 'One or more stage artifacts unavailable; actual completed job logs retained.' > cycle-evidence/artifact-download-incomplete.txt\nfi\ngh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100 > cycle-evidence/actions-jobs.json\npython - <<'JOBS' > completed-jobs.txt\nimport json\nfor j in json.load(open('cycle-evidence/actions-jobs.json'))['jobs']:\n if j['status']=='completed' and j['conclusion']!='skipped': print(j['id'])\nJOBS\nwhile read job_id; do\n  gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/$job_id/logs > cycle-evidence/job-logs/$job_id.log\ndone < completed-jobs.txt\ncp research/session-vwap-failed-auction-v17/PLAN.md cycle-evidence/FROZEN_PLAN.md\ncp research/session-vwap-failed-auction-v17/IMPLEMENTATION_CONTRACT.md cycle-evidence/\n\
        cp research/session-vwap-failed-auction-v17/FROZEN_INPUT_HASHES.json cycle-evidence/\ncp research/session-vwap-failed-auction-v17/FROZEN_CONTEXT.json cycle-evidence/\ncp research/session-vwap-failed-auction-v17/PREEXECUTION_VALIDATION.json cycle-evidence/\n"
    - name: Archive every original trial, source, failure and audit
      shell: bash
      run: 'set -euo pipefail

        python scripts/research_evidence_archive.py archive --source cycle-evidence --kind V17-complete-or-partial --out research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/complete-evidence'
    - name: Preserve evidence on a separate research branch
      shell: bash
      run: 'set -euo pipefail

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "research-session-vwap-failed-auction-v17-evidence-${{ github.run_id }}"

        git add "research/session-vwap-failed-auction-v17/run-${{ github.run_id }}/complete-evidence"

        git commit -m "Preserve V17 evidence before subsequent research stages"

        git push origin HEAD

        '
    needs:
    - validate
    - development
    - selection
    - gate
    - accounts
    permissions:
      contents: write
      actions: read
    if: always()

