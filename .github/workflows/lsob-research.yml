name: LSOB ICT Research

on:
  workflow_dispatch:
  push:
    branches:
      - research-lsob-ict
    paths:
      - ".github/workflows/lsob-research.yml"

jobs:
  btc-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Syntax check
        run: |
          python -m py_compile research/vendor/lsob_reference.py
          python -m py_compile research/lsob_benchmark.py

      - name: Run 1h temporal stability checks
        run: |
          python research/lsob_benchmark.py --symbol BTCUSDT --timeframes 1h --start 2024-08-24 --end 2025-08-23 --displacement-bars 3,4 --outdir research/results/btc_y1
          python research/lsob_benchmark.py --symbol BTCUSDT --timeframes 1h --start 2025-08-24 --end 2026-08-24 --displacement-bars 3,4 --outdir research/results/btc_y2
          python research/lsob_benchmark.py --symbol ETHUSDT --timeframes 1h --start 2024-08-24 --end 2025-08-23 --displacement-bars 3 --outdir research/results/eth_y1
          python research/lsob_benchmark.py --symbol ETHUSDT --timeframes 1h --start 2025-08-24 --end 2026-08-24 --displacement-bars 3 --outdir research/results/eth_y2

      - name: Show summaries
        if: always()
        run: |
          find research/results -name 'lsob_benchmark_summary.csv' -print -exec cat {} \;

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsob-temporal-stability
          path: research/results/
          if-no-files-found: warn
