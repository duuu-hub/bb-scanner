name: AOA Hazard V31

on:
  push:
    branches: [research-aoa-hazard-v31]
    paths:
      - "research/aoa_hazard_v31/**"
      - ".github/workflows/aoa-hazard-v31.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt scikit-learn
      - run: python -m py_compile research/aoa_hazard_v31/hazard_v31.py
      - run: python research/aoa_hazard_v31/hazard_v31.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoa-hazard-v31-results
          path: research/aoa_hazard_v31/output/
          if-no-files-found: error
          retention-days: 30
