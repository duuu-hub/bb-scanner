name: VWAP Fine Bins 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/vwap_fine_bins_run']
permissions: {contents: read, actions: read}
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - run: python scripts/vwap_fine_bins_5y.py --data data --shard ${{ matrix.shard }} --shards 8 --out fine_${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        with: {name: 'vwap-fine-${{ matrix.shard }}', path: 'fine_${{ matrix.shard }}.csv', if-no-files-found: error}
