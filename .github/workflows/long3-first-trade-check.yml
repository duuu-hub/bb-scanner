name: LONG3 First Demo Trade Check

on:
  push:
    paths:
      - '.github/workflows/long3-first-trade-check.yml'

permissions:
  contents: write

concurrency:
  group: bitget-bb-scanner-long3
  cancel-in-progress: false

jobs:
  first-demo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Scan Bitget once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RE_ALERT_PRICE_MOVE_PCT: '5.0'
        run: python scanner.py

      - name: Build deduplicated LONG3 order signals
        run: python long3_signal_adapter.py

      - name: Run Demo trader once
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_trader.py

      - name: Persist one-shot result
        run: |
          paths="state.json paper_signals.csv scan_runtime.json signals/pending.jsonl state/trading_state.json logs/executions.jsonl"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo 'No forward-state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in $paths; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git commit -m 'chore: persist LONG3 first demo check'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
