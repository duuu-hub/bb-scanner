name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_cpr_structure.py'
      - 'scripts/trend_continuation_cpr_structure_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  structure-replay:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen global continuation events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          gh run download 36934882492 -R ${{ github.repository }} \
            -n trend-continuation-global-events -D events
      - name: Download raw source shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" \
            -D raw_data
      - name: Replay signal-candle structure filters
        run: |
          rm -rf structure_result
          python scripts/trend_continuation_cpr_structure.py \
            --events-in events/continuation_events.csv.gz \
            --raw raw_data \
            --out structure_result
      - uses: actions/upload-artifact@v4
        with:
          name: trend-continuation-structure-shard-${{ matrix.shard }}
          path: |
            structure_result/cells.csv
            structure_result/summary.json
          retention-days: 30
          compression-level: 6

  structure-merge:
    needs: structure-replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: trend-continuation-structure-shard-*
          path: shard_results
      - name: Merge structure-filter metrics
        run: python scripts/trend_continuation_cpr_structure_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-continuation-structure-merged-${{ github.run_id }}
          path: |
            merged_cells.csv
            merged_summary.json
          retention-days: 30
          compression-level: 6
