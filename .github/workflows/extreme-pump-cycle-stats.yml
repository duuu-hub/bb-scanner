name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_body70_regime_partial.py'
      - 'scripts/trend_continuation_body70_regime_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  regime-partial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen BODY70 merged trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p body70
          gh run download 37078195174 -R ${{ github.repository }} \
            -n body70-validation-merged-37078195174 -D body70
          ls -lh body70/merged_trades.csv.gz
      - name: Download raw source shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" \
            -D raw_data
      - name: Build shard market breadth
        run: |
          rm -rf regime_partial
          python scripts/trend_continuation_body70_regime_partial.py \
            --trades body70/merged_trades.csv.gz \
            --raw raw_data \
            --out regime_partial
      - uses: actions/upload-artifact@v4
        with:
          name: body70-regime-partial-${{ matrix.shard }}
          path: regime_partial/breadth_partial.csv.gz
          retention-days: 30
          compression-level: 6

  regime-merge:
    needs: regime-partial
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: body70-regime-partial-*
          path: regime_partials
      - name: Download frozen BODY70 merged trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p body70
          gh run download 37078195174 -R ${{ github.repository }} \
            -n body70-validation-merged-37078195174 -D body70
      - name: Merge and diagnose regime decay
        run: |
          rm -rf regime_result
          python scripts/trend_continuation_body70_regime_merge.py \
            --partials regime_partials \
            --trades body70/merged_trades.csv.gz \
            --out regime_result
      - uses: actions/upload-artifact@v4
        with:
          name: body70-regime-merged-${{ github.run_id }}
          path: |
            regime_result/breadth_merged.csv.gz
            regime_result/body70_trades_with_regime.csv.gz
            regime_result/year_regime.csv
            regime_result/monthly.csv
            regime_result/summary.json
          retention-days: 30
          compression-level: 6
