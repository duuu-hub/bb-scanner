name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - '.research/extreme_pump_cycle_stats_run'
      - 'research/extreme_pump_cycles.py'
      - 'scripts/trend_continuation_first_touch.py'
      - 'scripts/trend_continuation_merge_shards.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 5Y shards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p pump_data
          gh run download 36095439671 -D pump_data \
            -n rank5-binance-um-15m-5y-data-shard-0 \
            -n rank5-binance-um-15m-5y-data-shard-1 \
            -n rank5-binance-um-15m-5y-data-shard-2 \
            -n rank5-binance-um-15m-5y-data-shard-3 \
            -n rank5-binance-um-15m-5y-data-shard-4 \
            -n rank5-binance-um-15m-5y-data-shard-5 \
            -n rank5-binance-um-15m-5y-data-shard-6 \
            -n rank5-binance-um-15m-5y-data-shard-7
      - name: Compute cycle statistics
        run: |
          rm -rf pump_cycle_result
          python research/extreme_pump_cycles.py --data-root pump_data --out pump_cycle_result
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-pump-cycle-stats-${{ github.run_id }}
          path: pump_cycle_result/
          retention-days: 30
          compression-level: 6

  wide-sl-replay:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
        tp: [1.5,2.0,3.0]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen global continuation events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          gh run download 36934882492 -R ${{ github.repository }} \
            -n trend-continuation-global-events -D events
          ls -lh events/continuation_events.csv.gz
      - name: Download raw source shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" \
            -D raw_data
      - name: Replay TP/SL grid shard with canonical 1m chronology
        run: |
          rm -rf shard_result
          python scripts/trend_continuation_first_touch.py \
            --parts unused \
            --events-in events/continuation_events.csv.gz \
            --raw raw_data \
            --restrict-to-raw-symbols \
            --tp-pct "${{ matrix.tp }}" \
            --out shard_result
      - uses: actions/upload-artifact@v4
        with:
          name: trend-continuation-tpsl-tp-${{ matrix.tp }}-shard-${{ matrix.shard }}
          path: |
            shard_result/cells.csv
            shard_result/summary.json
          retention-days: 30
          compression-level: 6

  wide-sl-merge:
    needs: wide-sl-replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: trend-continuation-tpsl-tp-*-shard-*
          path: shard_results
      - name: Merge exact aggregate metrics
        run: python scripts/trend_continuation_merge_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-continuation-tpsl-merged-${{ github.run_id }}
          path: |
            merged_cells.csv
            merged_summary.json
          retention-days: 30
          compression-level: 6
