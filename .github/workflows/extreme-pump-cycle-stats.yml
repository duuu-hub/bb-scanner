name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_body70_context_partial.py'
      - 'scripts/trend_continuation_body70_context_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  context-partial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen BODY70 executed trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p body70
          gh run download 37078195174 -R ${{ github.repository }} \
            -n body70-validation-merged-37078195174 -D body70
      - name: Download frozen global events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          gh run download 36934882492 -R ${{ github.repository }} \
            -n trend-continuation-global-events -D events
      - name: Download raw shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw_data
      - name: Build signal-context diagnostics
        run: |
          rm -rf context_result
          python scripts/trend_continuation_body70_context_partial.py \
            --trades body70/merged_trades.csv.gz \
            --events events/continuation_events.csv.gz \
            --raw raw_data \
            --out context_result
      - uses: actions/upload-artifact@v4
        with:
          name: body70-context-partial-${{ matrix.shard }}
          path: context_result/context_partial.csv.gz
          retention-days: 30

  context-merge:
    needs: context-partial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: body70-context-partial-*
          path: context_partials
      - name: Merge signal-context diagnostics
        run: |
          rm -rf context_merged
          python scripts/trend_continuation_body70_context_merge.py \
            --partials context_partials \
            --out context_merged
      - uses: actions/upload-artifact@v4
        with:
          name: body70-context-merged-${{ github.run_id }}
          path: |
            context_merged/context_all.csv.gz
            context_merged/summary.json
          retention-days: 30
