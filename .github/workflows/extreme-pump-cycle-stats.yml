name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_body70_promising_robust.py'
      - 'scripts/trend_continuation_body70_promising_robust_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  robust-partial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen global events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          gh run download 36934882492 -R ${{ github.repository }} \
            -n trend-continuation-global-events -D events
      - name: Download raw shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw_data
      - name: Run execution robustness
        run: |
          rm -rf robust_result
          python scripts/trend_continuation_body70_promising_robust.py \
            --events-in events/continuation_events.csv.gz \
            --raw raw_data \
            --out robust_result
      - uses: actions/upload-artifact@v4
        with:
          name: body70-promising-robust-partial-${{ matrix.shard }}
          path: robust_result/trades.csv.gz
          retention-days: 30

  robust-merge:
    needs: robust-partial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: body70-promising-robust-partial-*
          path: robust_partials
      - name: Merge robustness
        run: |
          rm -rf robust_merged
          python scripts/trend_continuation_body70_promising_robust_merge.py \
            --partials robust_partials \
            --out robust_merged
      - uses: actions/upload-artifact@v4
        with:
          name: body70-promising-robust-merged-${{ github.run_id }}
          path: |
            robust_merged/trades_all.csv.gz
            robust_merged/summary.json
          retention-days: 30
