name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_body70_stop_path_partial.py'
      - 'scripts/trend_continuation_body70_stop_path_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  stop-path-partial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen BODY70 executed trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p body70
          gh run download 37078195174 -R ${{ github.repository }} \
            -n body70-validation-merged-37078195174 -D body70
      - name: Download raw shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw_data
      - name: Deep stop-path diagnostics
        run: |
          rm -rf stop_path_result
          python scripts/trend_continuation_body70_stop_path_partial.py \
            --trades body70/merged_trades.csv.gz \
            --raw raw_data \
            --out stop_path_result
      - uses: actions/upload-artifact@v4
        with:
          name: body70-stop-path-partial-${{ matrix.shard }}
          path: stop_path_result/stop_path.csv.gz
          retention-days: 30

  stop-path-merge:
    needs: stop-path-partial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: body70-stop-path-partial-*
          path: stop_path_partials
      - name: Merge deep stop-path diagnostics
        run: |
          rm -rf stop_path_merged
          python scripts/trend_continuation_body70_stop_path_merge.py \
            --partials stop_path_partials \
            --out stop_path_merged
      - uses: actions/upload-artifact@v4
        with:
          name: body70-stop-path-merged-${{ github.run_id }}
          path: |
            stop_path_merged/stop_path_all.csv.gz
            stop_path_merged/monthly_stop_path.csv
            stop_path_merged/summary.json
          retention-days: 30
