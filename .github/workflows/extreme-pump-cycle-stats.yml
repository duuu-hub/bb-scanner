name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/trend_continuation_body70_validate.py'
      - 'scripts/trend_continuation_body70_validate_merge.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  body70-validate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen global continuation events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          gh run download 36934882492 -R ${{ github.repository }} \
            -n trend-continuation-global-events -D events
      - name: Download raw source shard ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw_data
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" \
            -D raw_data
      - name: Run frozen BODY70 validation
        run: |
          rm -rf body70_result
          python scripts/trend_continuation_body70_validate.py \
            --events-in events/continuation_events.csv.gz \
            --raw raw_data \
            --out body70_result
      - uses: actions/upload-artifact@v4
        with:
          name: body70-validation-shard-${{ matrix.shard }}
          path: |
            body70_result/trades.csv.gz
            body70_result/summary.json
            body70_result/summary_rows.json
            body70_result/yearly.csv
            body70_result/recent_windows.csv
            body70_result/symbol_stats.csv
          retention-days: 30
          compression-level: 6

  body70-merge:
    needs: body70-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: body70-validation-shard-*
          path: shard_results
      - name: Merge BODY70 validation
        run: python scripts/trend_continuation_body70_validate_merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: body70-validation-merged-${{ github.run_id }}
          path: |
            merged_trades.csv.gz
            merged_summary.json
            merged_yearly.csv
            merged_recent_windows.csv
            merged_symbol_stats.csv
          retention-days: 30
          compression-level: 6
