name: Extreme Pump Cycle Stats
on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - '.research/extreme_pump_cycle_stats_run'
      - 'research/extreme_pump_cycles.py'
      - '.github/workflows/extreme-pump-cycle-stats.yml'

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 5Y shards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p pump_data
          gh run download 36095439671 -D pump_data \
            -n rank5-binance-um-15m-5y-data-shard-0 \
            -n rank5-binance-um-15m-5y-data-shard-1 \
            -n rank5-binance-um-15m-5y-data-shard-2 \
            -n rank5-binance-um-15m-5y-data-shard-3 \
            -n rank5-binance-um-15m-5y-data-shard-4 \
            -n rank5-binance-um-15m-5y-data-shard-5 \
            -n rank5-binance-um-15m-5y-data-shard-6 \
            -n rank5-binance-um-15m-5y-data-shard-7
          find pump_data -name '*USDT.csv.gz' | wc -l
      - name: Compute cycle statistics
        run: |
          rm -rf pump_cycle_result
          python research/extreme_pump_cycles.py --data-root pump_data --out pump_cycle_result
      - name: Upload compact result
        uses: actions/upload-artifact@v4
        with:
          name: extreme-pump-cycle-stats-${{ github.run_id }}
          path: pump_cycle_result/
          retention-days: 30
          compression-level: 6
