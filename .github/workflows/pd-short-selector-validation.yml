name: PD Short Selector Validation
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_short_selector_validation_once']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: |
          python -m py_compile research/pd_short_selector_validation.py
          python research/pd_short_selector_validation.py --self-test
  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: |
          mkdir -p input canonical core
          gh run download 36159685183 --repo duuu-hub/bb-scanner --name pd-4h-breakdown-short-VERIFIED -D canonical
          gh run download 36072122659 --repo duuu-hub/bb-scanner --name core-three-way-5y-portfolio -D core
          for s in 0 1 2 3 4 5 6 7; do
            gh run download 36095439671 --repo duuu-hub/bb-scanner --name rank5-binance-um-15m-5y-data-shard-$s -D input/shard-$s
          done
        env: {GH_TOKEN: '${{ github.token }}'}
      - run: python research/pd_short_selector_validation.py --input input --canonical canonical/trades_all.csv --core core/core_daily.csv.gz --sims 10000 --out out
      - uses: actions/upload-artifact@v4
        with: {name: pd-short-selector-validation-VERIFIED, path: out/, if-no-files-found: error}
