name: Shock Confirmation V3 Research Cycle

'on':
  push:
    branches: [research-shock-confirmation-v3]
    paths: ['.research/shock-confirmation-v3-run']

permissions:
  contents: read
  actions: read

concurrency:
  group: shock-confirmation-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Validate causal inputs, chronological exits and account observations
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/shock_confirmation_v3.py scripts/day_edge_canonical.py
          python -m unittest discover -s tests -p test_shock_confirmation_v3.py -v 2>&1 | tee confirm-tests.log
          python -m unittest discover -s tests -p test_day_edge_canonical.py -v 2>&1 | tee canonical-tests.log
          python -m unittest discover -s tests -p test_day_edge_lab.py -v 2>&1 | tee scout-tests.log
          python -m unittest discover -s tests -p test_relative_pullback_v1.py -v 2>&1 | tee account-tests.log
          python scripts/psar_chronology_smoke.py | tee chronology-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-validation
          path: |
            confirm-tests.log
            canonical-tests.log
            scout-tests.log
            account-tests.log
            chronology-smoke.log
            research/shock-confirmation-v3/PLAN.md
          retention-days: 30

  development:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/cache@v4
        with:
          path: cache/1m
          key: shock-confirm-v3-dev-1m-shard-${{ matrix.shard }}
          restore-keys: |
            day-edge-canon-v2-source-36095439671-shard-${{ matrix.shard }}
      - uses: actions/cache@v4
        id: source-cache
        with:
          path: data
          key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
      - name: Download immutable market shard
        if: steps.source-cache.outputs.cache-hit != 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
      - name: BTC context
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
      - name: All 96 development policies with canonical stop/TP chronology
        run: python scripts/shock_confirmation_v3.py scan --stage DEV --data data --btc btc/BTCUSDT.csv.gz --out dev-${{ matrix.shard }} --minute-cache cache/1m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-dev-${{ matrix.shard }}
          path: dev-${{ matrix.shard }}/
          retention-days: 30
          compression-level: 0

  selection:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      selected_count: ${{ steps.pick.outputs.selected_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with: {pattern: 'shock-confirm-v3-dev-[0-7]', path: dev-parts}
      - name: Freeze development-only selection
        id: pick
        run: |
          python scripts/shock_confirmation_v3.py select --parts dev-parts --out selected-input
          python - <<'PY'
          import json,os
          n=len(json.load(open('selected-input/selection.json'))['policies'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('selected_count='+str(n)+'\n')
          PY
      - name: Preserve development evidence even when there is no survivor
        env: {RESULT_BRANCH: 'research-shock-confirm-v3-dev-${{ github.run_id }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,os,hashlib
          dest=Path('research/shock-confirmation-v3')/('run-'+os.environ['GITHUB_RUN_ID'])/'development'
          shutil.copytree('selected-input',dest)
          for i,p in enumerate(sorted(Path('dev-parts').rglob('scan_meta.json'))):
            shutil.copyfile(p,dest/f'full_dev_shard_{i}_meta.json')
          for i,p in enumerate(sorted(Path('dev-parts').rglob('exclusions.csv'))):
            shutil.copyfile(p,dest/f'full_dev_shard_{i}_exclusions.csv')
          (dest/'provenance.json').write_text(json.dumps(dict(
            run=int(os.environ['GITHUB_RUN_ID']),executed_commit=os.environ['GITHUB_SHA'],
            source_data_run=36095439671,policy_trials=96,
            sha256={str(p.relative_to(dest)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in dest.rglob('*') if p.is_file()}),indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RESULT_BRANCH"
          git add "research/shock-confirmation-v3/run-${{ github.run_id }}"
          git commit -m "Preserve V3 development selection and all policy diagnostics"
          git push origin "$RESULT_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-selected
          path: selected-input/
          retention-days: 30
          compression-level: 0

  gate:
    needs: selection
    if: needs.selection.outputs.selected_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/cache@v4
        with:
          path: cache/1m
          key: shock-confirm-v3-gate-1m-shard-${{ matrix.shard }}
          restore-keys: |
            shock-confirm-v3-dev-1m-shard-${{ matrix.shard }}
            day-edge-canon-v2-source-36095439671-shard-${{ matrix.shard }}
      - uses: actions/cache@v4
        id: source-cache
        with:
          path: data
          key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
      - name: Frozen source and BTC
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if [ ! -d data ]; then
            gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
          fi
          gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
      - uses: actions/download-artifact@v4
        with: {name: shock-confirm-v3-selected, path: selected-input}
      - name: Frozen selected policies, 2024 historical gate
        run: python scripts/shock_confirmation_v3.py scan --stage GATE --data data --btc btc/BTCUSDT.csv.gz --selection selected-input/selection.json --out gate-${{ matrix.shard }} --minute-cache cache/1m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-gate-${{ matrix.shard }}
          path: gate-${{ matrix.shard }}/
          retention-days: 30
          compression-level: 0

  accounts:
    needs: [selection, gate]
    if: needs.selection.outputs.selected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with: {name: shock-confirm-v3-selected, path: combined-parts}
      - uses: actions/download-artifact@v4
        with: {pattern: 'shock-confirm-v3-gate-[0-7]', path: combined-parts/gate}
      - name: Frozen account marking source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D market
      - name: Actual account growth, daily goals and arithmetic audit
        run: python scripts/day_edge_canonical.py accounts --data market --parts combined-parts --out confirm-account --selection combined-parts/selection.json --expected-shards 16
      - name: Preserve complete account results on a separate result branch
        env:
          RESULT_BRANCH: 'research-shock-confirm-v3-results-${{ github.run_id }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib,os,pandas as pd
          dest=Path('research/shock-confirmation-v3')/('run-'+os.environ['GITHUB_RUN_ID'])/'accounts'
          dest.mkdir(parents=True)
          for name in ['summary.csv','summary.json','year_quarter.csv','audit.json',
                       'survivors.json','independent_candidates.csv.gz']:
            shutil.copyfile(Path('confirm-account')/name,dest/name)
          shutil.copyfile('combined-parts/selection.json',dest/'selection.json')
          shutil.copyfile('combined-parts/development_policy_cells.csv',dest/'development_policy_cells.csv')
          for i,p in enumerate(sorted(Path('combined-parts').rglob('scan_meta.json'))):
            shutil.copyfile(p,dest/f'scan_shard_{i}_meta.json')
          for i,p in enumerate(sorted(Path('combined-parts/gate').rglob('exclusions.csv'))):
            shutil.copyfile(p,dest/f'gate_shard_{i}_exclusions.csv')
          rows=[]
          for p in Path('confirm-account/details').glob('*/trades.csv.gz'):
            try:d=pd.read_csv(p)
            except pd.errors.EmptyDataError:continue
            d['scenario']=p.parent.name;rows.append(d)
          if rows:pd.concat(rows,ignore_index=True).to_csv(dest/'executed_trades.csv.gz',index=False,compression='gzip')
          (dest/'provenance.json').write_text(json.dumps(dict(
            run=int(os.environ['GITHUB_RUN_ID']),executed_commit=os.environ['GITHUB_SHA'],
            source_data_run=36095439671,
            sha256={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.iterdir() if p.is_file()}),indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RESULT_BRANCH"
          git add "research/shock-confirmation-v3/run-${{ github.run_id }}"
          git commit -m "Preserve V3 constrained account results and rejected policies"
          git push origin "$RESULT_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-account-summary
          path: research/shock-confirmation-v3/run-${{ github.run_id }}/accounts/
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shock-confirm-v3-account-details
          path: confirm-account/
          retention-days: 30
          compression-level: 0
