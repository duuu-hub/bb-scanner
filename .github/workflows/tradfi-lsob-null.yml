name: TradFi LSOB Matched Null

on:
  push:
    branches:
      - research-liquid-smc
    paths:
      - "research/tradfi_lsob_null.py"
      - ".github/workflows/tradfi-lsob-null.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-liquid-smc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-backtest.txt
          pip install yfinance
      - run: python -m research.tradfi_lsob_null
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/tradfi_lsob_null
          git commit -m "research: persist TradFi matched null results"
          git pull --rebase origin research-liquid-smc
          git push origin HEAD:research-liquid-smc
