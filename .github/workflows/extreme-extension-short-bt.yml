name: Extreme Extension Short Backtest
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - '.research/extreme_extension_short_bt_run'

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 5Y shards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p pump_data
          gh run download 36095439671 -D pump_data \
            -n rank5-binance-um-15m-5y-data-shard-0 \
            -n rank5-binance-um-15m-5y-data-shard-1 \
            -n rank5-binance-um-15m-5y-data-shard-2 \
            -n rank5-binance-um-15m-5y-data-shard-3 \
            -n rank5-binance-um-15m-5y-data-shard-4 \
            -n rank5-binance-um-15m-5y-data-shard-5 \
            -n rank5-binance-um-15m-5y-data-shard-6 \
            -n rank5-binance-um-15m-5y-data-shard-7
      - name: Run causal extreme-extension short backtest
        run: |
          rm -rf extreme_short_bt
          python research/extreme_extension_short_bt.py --data-root pump_data --out extreme_short_bt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: extreme-extension-short-bt-${{ github.run_id }}
          path: extreme_short_bt/
          retention-days: 30
          compression-level: 6
