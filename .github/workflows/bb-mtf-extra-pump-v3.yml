name: BB MTF Observed Extra Pump V3
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/bb_mtf_extra_pump_v3_launch']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - run: python scripts/bb_mtf_open_extra_pump_v3.py --audit
  shard:
    needs: audit
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Frozen 5Y Binance UM 15M candles
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - run: python scripts/bb_mtf_open_extra_pump_v3.py --shards 4 --shard ${{ matrix.shard }} --data data --out bb-pump-shard-${{ matrix.shard }}.csv.gz --meta bb-pump-meta-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bb-mtf-pump-shard-${{ matrix.shard }}
          path: |
            bb-pump-shard-${{ matrix.shard }}.csv.gz
            bb-pump-meta-${{ matrix.shard }}.json
  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-mtf-pump-shard-*
          path: merged
      - run: python scripts/bb_mtf_open_extra_pump_v3.py --merge --shards 4 --data merged --out bb-mtf-extra-pump-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bb-mtf-extra-pump-report
          path: bb-mtf-extra-pump-report.json
