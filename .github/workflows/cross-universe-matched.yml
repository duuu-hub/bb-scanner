name: Cross Universe Matched Diagnostics
on:
  push:
    branches: [research-final-edge-diagnostics]
    paths: ['.research/cross_universe_matched_once']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - env: {GH_TOKEN: ${{ github.token }}}
        run: |
          mkdir -p holdout auto50
          gh run download 35862728778 --repo duuu-hub/bb-scanner --name bb-auto100-switch-holdout-results --dir holdout
          gh run download 35845078138 --repo duuu-hub/bb-scanner --name exhaustive-context-results --dir auto50
      - run: python research/cross_universe_matched.py
      - uses: actions/upload-artifact@v4
        with:
          name: cross-universe-matched-results
          path: cross_universe_matched_results/
          retention-days: 14
