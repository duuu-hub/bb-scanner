name: PSAR 1D Live Portfolio Evolution
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1d_live_portfolio_trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: psar-1d-live-portfolio
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Compile
        run: python -m py_compile scripts/psar_1d_live_portfolio.py
      - name: Download immutable raw source and canonical frozen artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
          gh run download 36817230406 -R ${{ github.repository }} -p 'psar-1d-canonical-reconcile-*' -D canonical
      - name: TRAIN-only stop and risk freeze then HOLDOUT portfolio validation
        run: python scripts/psar_1d_live_portfolio.py --data data --canonical canonical --out results
      - name: Verify outputs
        run: |
          test -s results/summary.json
          test -s results/REPORT.md
          test -s results/audit_30_by_10.json
          test -s results/train_stop_candidates.csv
          test -s results/train_risk_grid.csv
          test -s results/holdout_cost_stress.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psar-1d-live-portfolio-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
