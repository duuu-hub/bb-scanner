name: Long Mirror Continuation V1
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/long_mirror_continuation_v1_run']
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Smoke
        run: |
          python -m py_compile scripts/long_continuation_mirror_v1.py scripts/long_short_continuation_combo_v1.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          import scripts.long_continuation_mirror_v1 as s
          assert s.IMPULSE_ATR==2.0 and s.SL_ATR==2.0 and s.TP_R==3.0 and s.HOLD_BARS==64
          print("LONG_MIRROR_V1_SMOKE_PASS")
          PY

  replay:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen data
        env:
          GH_TOKEN: '\${{ github.token }}'
        run: |
          mkdir -p data
          gh run download 36095439671 -R \${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Replay mirror long
        run: python scripts/long_continuation_mirror_v1.py --data data --shard \${{ matrix.shard }} --shards 6
      - uses: actions/upload-artifact@v4
        with:
          name: long-mirror-continuation-v1-\${{ matrix.shard }}
          path: |
            long_continuation_mirror_\${{ matrix.shard }}.csv.gz
            long_continuation_mirror_meta_\${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: long-mirror-continuation-v1-*
          path: long_artifacts
      - name: Download frozen short horizon artifact
        env:
          GH_TOKEN: '\${{ github.token }}'
        run: |
          mkdir -p short_source
          gh run download 36963458040 -R \${{ github.repository }} -n short-continuation-horizon-v2-final -D short_source
          test -f short_source/short_continuation_horizon_all.csv.gz
      - name: Combine long and short
        run: |
          python scripts/long_short_continuation_combo_v1.py \
            --long long_artifacts \
            --short short_source/short_continuation_horizon_all.csv.gz \
            --out mirror_combo_v1
      - uses: actions/upload-artifact@v4
        with:
          name: long-mirror-continuation-v1-final
          path: mirror_combo_v1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
