name: PSAR 1H Canonical ex-BNX Final
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1h_canonical_ex_bnx_final_run']
permissions: {contents: read, actions: read}
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact preserved components excluding BNX
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p old prior quarter subquarter finalsplit
          for s in 0 2 5 6 7; do gh run download 36387193831 -R ${{ github.repository }} -n psar-1h-stats-$s -D old/$s; done
          for s in 1 3 4 11; do gh run download 36470583311 -R ${{ github.repository }} -n psar-1h-canonical-recovery-$s -D prior/$s; done
          for s in 9 25 57 12 28 44 60; do gh run download 36507299281 -R ${{ github.repository }} -n psar-1h-canonical-quarter-$s -D quarter/$s; done
          for s in 41 105 169; do gh run download 36537297145 -R ${{ github.repository }} -n psar-1h-canonical-subquarter-$s -D subquarter/$s; done
          for s in 489 745 1001; do gh run download 36645859072 -R ${{ github.repository }} -n psar-1h-canonical-finalsplit-$s -D finalsplit/$s; done
      - name: Merge 855-file ex-BNX coverage
        run: |
          python - <<'PY'
          import glob,json
          fs=glob.glob("old/**/*.json",recursive=True)+glob.glob("prior/**/*.json",recursive=True)+glob.glob("quarter/**/*.json",recursive=True)+glob.glob("subquarter/**/*.json",recursive=True)+glob.glob("finalsplit/**/*.json",recursive=True)
          assert len(fs)==22,(len(fs),fs)
          ds=[json.load(open(x)) for x in fs];assert all(not d.get("errors") for d in ds)
          totals={d["definition"]["input_files_total"] for d in ds};assert totals=={856},totals
          assert sum(d["files"] for d in ds)==855,sum(d["files"] for d in ds)
          drop={"shard_index","shard_count","workflow_commit_sha"}
          def sem(d):return {k:v for k,v in d["definition"].items() if k not in drop}
          assert all(sem(d)==sem(ds[0]) for d in ds),"semantic definition mismatch"
          derived={"win_pct_amb_loss","gross_expectancy_R_amb_loss"};agg={}
          for d in ds:
            for k,v in d["summary"].items():
              q=agg.setdefault(k,{kk:0 for kk in v if kk not in derived})
              for kk,vv in v.items():
                if kk not in derived:q[kk]+=vv
          for k,q in agg.items():
            assert q["taker"]+q["maker"]==q["fills"],(k,q)
            assert q["win"]+q["loss"]+q["data_gap"]+q["exit_mismatch"]+q["unresolved_eod"]==q["fills"],(k,q)
            resolved=q["win"]+q["loss"];r=float(k.split("|R")[1].split("|")[0])
            q["win_pct_amb_loss"]=round(100*q["win"]/resolved,3) if resolved else None
            q["gross_expectancy_R_amb_loss"]=round((q["win"]*r-q["loss"])/resolved,5) if resolved else None
          out={"definition":sem(ds[0]),"files":855,"excluded":["BNXUSDT"],"summary":agg,"coverage":"exact all 856 source files except residue 233/1024 = BNXUSDT"}
          json.dump(out,open("psar_1h_canonical_ex_BNX_FINAL.json","w"),indent=2)
          print("EX_BNX_FINAL_PASS",855,len(agg))
          top=[]
          for k,q in agg.items():
            n=q["win"]+q["loss"]
            if not n:continue
            r=float(k.split("|R")[1].split("|")[0]);pf=q["win"]*r/q["loss"] if q["loss"] else None
            top.append((pf or -1,k,q["win_pct_amb_loss"],q["gross_expectancy_R_amb_loss"],q["fills"],q["taker"],q["maker"]))
          for row in sorted(top,reverse=True)[:30]:print("TOP",row)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: psar-1h-canonical-ex-BNX-FINAL, path: psar_1h_canonical_ex_BNX_FINAL.json}
