name: No Time Limit Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'no_time_limit.py'
      - '.github/workflows/no-time-limit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Download Candidate1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p c1
          gh run download 35652776527 -n candidate1-exposure-results -D c1

      - name: Run no-time-limit test
        env:
          BACKTEST_API_RPS: '6'
        run: |
          python no_time_limit.py \
            --trades c1/candidate1_trades.csv \
            --outdir no_time_results \
            --workers 6

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-time-limit-results
          path: no_time_results/
          if-no-files-found: warn
