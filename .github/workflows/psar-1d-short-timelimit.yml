name: PSAR 1D SHORT Time Limits
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1d_short_timelimit_run']
permissions: {contents: read, actions: read}
defaults:
  run:
    shell: bash
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 PyYAML==6.0.2
      - name: Sixty execution cases and ten clean rounds
        run: |
          python -m py_compile scripts/psar_1d_exec_helpers.py scripts/psar_1d_short_timelimit.py scripts/psar_1d_timelimit_summarize.py
          python tests/audit_psar_1d_timelimit.py --rounds 10 > audit.txt 2>&1
          cat audit.txt
          python tests/smoke_psar_1d_summary.py
          git rev-parse HEAD
          sha256sum scripts/psar_1d_short_timelimit.py scripts/psar_1d_exec_helpers.py
          python -c "import sys; sys.path.insert(0,'scripts'); import psar_1d_exec_helpers,psar_1d_short_timelimit; print('HELPER_AND_ENGINE_IMPORT_OK')"
          python scripts/psar_1d_short_timelimit.py --help | grep -- '--out'
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Actual data smoke with full result invariants
        run: |
          python scripts/psar_1d_short_timelimit.py --data data --shard 0 --shards 64 --out smoke.csv.gz
          python - <<'PY'
          import sys,json,pandas as pd
          sys.path.insert(0,'scripts')
          from psar_1d_short_timelimit import validate
          x=pd.read_csv('smoke.csv.gz');validate(x)
          m=json.load(open('smoke.csv.gz.meta.json'))
          assert m['events']==len(x)
          print('SMOKE_OK',len(x),m['diagnostics'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psar-1d-short-timelimit-smoke
          if-no-files-found: error
          path: |
            audit.txt
            smoke.csv.gz
            smoke.csv.gz.meta.json
  run:
    needs: smoke
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - run: |
          python -m py_compile scripts/psar_1d_short_timelimit.py
          python scripts/psar_1d_short_timelimit.py --data data --shard ${{ matrix.shard }} --shards 8 --out tl_${{ matrix.shard }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1d-short-timelimit-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            tl_${{ matrix.shard }}.csv.gz
            tl_${{ matrix.shard }}.csv.gz.meta.json
  summarize:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p in baseline
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'psar-1d-short-timelimit-*' -D in
          gh run download 36710246395 -R ${{ github.repository }} -p 'psar-1d-vol-both-*' -D baseline
      - name: Merge audit, costs, train-holdout, baseline comparison
        run: python scripts/psar_1d_timelimit_summarize.py --input in --baseline baseline --output summary | tee summary_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psar-1d-short-timelimit-summary
          if-no-files-found: error
          path: |
            summary/
            summary_log.txt
