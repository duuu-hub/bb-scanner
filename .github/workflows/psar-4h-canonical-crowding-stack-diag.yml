name: PSAR 4H Canonical Crowding Stack Diagnostic
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_canonical_crowding_stack_diag_run']
permissions: {contents: read, actions: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download canonical finalist ledger
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p ledger
          gh run download 36519239563 -R ${{ github.repository }} -p 'psar-4h-canonical-finalist-ledger-*' -D ledger
      - name: Download setup-count sizing shards
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p sizing
          gh run download 36437560302 -R ${{ github.repository }} -p 'psar-4h-short-sizing-*' -D sizing
      - name: Diagnose crowding and stacking
        run: python scripts/psar_4h_canonical_crowding_stack_diag.py --ledger ledger --sizing sizing --out crowd_stack_diag.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-canonical-crowding-stack-diag
          path: crowd_stack_diag.json
