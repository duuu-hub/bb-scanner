name: PD Breakdown Selector OOS
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_selector_oos_once']
permissions: {contents: read, actions: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_selector_oos.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36095439671, pattern: rank5-binance-um-15m-5y-*, path: data, merge-multiple: true}
      - run: python research/pd_breakdown_selector_oos.py --input data --trades trades/trades_all.csv --wf wf/walkforward.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd, numpy as np
          s=pd.read_csv("out/sanity.csv");r=pd.read_csv("out/selector_summary.csv")
          assert s.feature_match.iloc[0]>.95 and set(r.basket)=={5,10} and len(r.method.unique())==6
          assert np.isfinite(r.event_pf).all()
          print("VERIFIED",s.to_dict("records")[0],len(r))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-selector-oos-VERIFIED, path: out/, if-no-files-found: error}
