name: Candidate1 Exposure Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'candidate1_exposure.py'
      - '.github/workflows/candidate1-exposure.yml'

jobs:
  candidate1-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Download source backtest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_backtest
          gh run download 35584621765 -n bb-backtest-results -D source_backtest

      - name: Run candidate1 exposure simulation
        env:
          BACKTEST_WORKERS: '6'
          BACKTEST_API_RPS: '6'
        run: |
          python candidate1_exposure.py \
            --source source_backtest/snapshots.csv.gz \
            --outdir candidate1_exposure_results \
            --workers 6 \
            --extra-symbols "LSKUSDT,TUTUSDT,LABUSDT,ALLOUSDT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate1-exposure-results
          path: candidate1_exposure_results/
          if-no-files-found: warn
