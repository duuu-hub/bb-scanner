name: LSOB Regime Split

on:
  workflow_dispatch:
  push:
    branches:
      - research-env-optimize
    paths:
      - "research/lsob_regime_analysis.py"
      - ".github/workflows/lsob-regime-split.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-env-optimize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt
      - name: Run causal regime split
        run: python -m research.lsob_regime_analysis --days 120
      - name: Persist regime analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/lsob_auto100/causal_regime_15m.csv research/results/lsob_auto100/trades_with_regime.csv research/results/lsob_auto100/regime_split.csv research/results/lsob_auto100/regime_distribution.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist LSOB causal regime split"
          git pull --rebase origin research-env-optimize
          git push origin HEAD:research-env-optimize
