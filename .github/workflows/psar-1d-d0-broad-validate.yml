name: PSAR 1D D0 Broad Validate
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1d_d0_broad_run']
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - run: python -m py_compile scripts/psar_1d_d0_broad_validate.py
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 36691537039 -R ${{ github.repository }} -p 'psar-distance-age-1d-*' -D artifacts
      - run: python scripts/psar_1d_d0_broad_validate.py --data artifacts --out result.json
      - run: test -s result.json
      - uses: actions/upload-artifact@v4
        with: {name: psar-1d-d0-broad-validate, path: result.json}
