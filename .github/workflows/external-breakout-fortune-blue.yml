name: External Breakout Fortune Blue Replay 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/external_breakout_fortune_blue_run']
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Syntax
        run: python -m py_compile scripts/external_breakout_replay.py scripts/external_breakout_merge.py scripts/external_breakout_smoke.py
      - name: Chronology and causality smoke
        run: python scripts/external_breakout_smoke.py

  replay:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen Binance 15m 5Y data
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          mkdir -p data
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Replay shard
        run: python scripts/external_breakout_replay.py --data data --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: external-breakout-replay-${{ matrix.shard }}
          path: |
            external_breakout_trades_shard_${{ matrix.shard }}.csv.gz
            external_breakout_meta_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: external-breakout-replay-*
          path: artifacts
      - name: Merge and frozen train/holdout report
        run: python scripts/external_breakout_merge.py --input artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: external-breakout-fortune-blue-final
          path: |
            external_breakout_summary.csv
            external_breakout_train_holdout.csv
            external_breakout_report.md
            external_breakout_all_trades.csv.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
