name: PSAR Fade Concurrent Rank Stress
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_fade_rank_v1_launch']
permissions: {contents: read, actions: read}
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - run: python scripts/psar_fade_concurrent_rank_stress.py --audit
      - name: Download frozen account entries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir ledgers && gh run download 37741872209 -R ${{ github.repository }} -p 'psar-risk-portfolio-shard-*' -D ledgers
      - run: python scripts/psar_fade_concurrent_rank_stress.py --data ledgers --out psar-fade-rank-stress.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-fade-rank-stress-report
          path: psar-fade-rank-stress.json
