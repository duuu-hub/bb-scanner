name: VWAP20 Trend Regime 5Y Corrected
on:
 push:
  branches: [research-rank5-binance-15m-5y]
  paths: ['.research/vwap20_trend_regime_run']
permissions: {contents: read, actions: read}
jobs:
 test:
  strategy:
   fail-fast: false
   matrix: {shard: [0,1,2,3,4,5,6,7]}
  runs-on: ubuntu-latest
  timeout-minutes: 120
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install pandas numpy
   - name: Download 5Y
     env: {GH_TOKEN: '${{ github.token }}'}
     run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
   - run: python scripts/vwap20_trend_regime_5y.py --data data --shard ${{ matrix.shard }} --shards 8 --out regime_${{ matrix.shard }}.csv
   - uses: actions/upload-artifact@v4
     with: {name: 'vwap20-regime-${{ matrix.shard }}', path: 'regime_${{ matrix.shard }}.csv'}
