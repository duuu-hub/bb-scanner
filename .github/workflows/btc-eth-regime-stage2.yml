name: BTC ETH Regime Stage2

on:
  workflow_dispatch:
  push:
    branches:
      - research-btc-eth-core
    paths:
      - "research/btc_eth_regime_stage2.py"
      - ".github/workflows/btc-eth-regime-stage2.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Syntax check
        run: python -m py_compile research/btc_eth_regime_stage2.py

      - name: Run regime stage2
        run: python research/btc_eth_regime_stage2.py

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-regime-stage2
          path: research_output/btc_eth_regime_stage2/
          if-no-files-found: error
