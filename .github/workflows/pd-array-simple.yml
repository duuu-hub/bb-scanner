name: PD Array Simple Research
on:
  push:
    branches: [research/pd-array-simple]
    paths:
      - research/pd_direction_eventstudy.py
      - .github/workflows/pd-array-simple.yml
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - name: Run PD direction event study
        run: python research/pd_direction_eventstudy.py
      - uses: actions/upload-artifact@v4
        with:
          name: pd-direction-5y
          path: pd_direction_results/
