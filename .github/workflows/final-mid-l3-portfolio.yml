name: Final MID L3 Portfolio
'on':
  push:
    branches: [research-final-edge-diagnostics]
    paths: [.research/final_mid_l3_once]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Download source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p context regime
          gh run download 35845078138 --repo duuu-hub/bb-scanner --name exhaustive-context-results --dir context
          gh run download 35841732224 --repo duuu-hub/bb-scanner --name regime-breadth-research --dir regime
      - run: python research/final_mid_l3_portfolio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mid-l3-portfolio-results
          path: final_portfolio_results/
          retention-days: 14
