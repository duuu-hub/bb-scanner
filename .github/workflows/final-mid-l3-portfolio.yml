name: Final MID L3 Portfolio
'on':
  push:
    branches:
      - research-final-edge-diagnostics
    paths:
      - .research/final_mid_l3_once
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Download research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p holdout context l3
          gh run download 35862728778 --repo duuu-hub/bb-scanner --name bb-auto100-switch-holdout-results --dir holdout
          gh run download 35845078138 --repo duuu-hub/bb-scanner --name exhaustive-context-results --dir context\n          gh run download 35857816376 --repo duuu-hub/bb-scanner --name l3-independent-event-analysis --dir l3
      - run: python research/final_mid_l3_portfolio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-mid-l3-portfolio-results
          path: final_portfolio_results/
          retention-days: 14
