name: PSAR Distance Age Study
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_distance_age_run']
permissions: {contents: read, actions: read}
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        tf: [1h,4h]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - run: python scripts/psar_distance_age_study.py --data data --tf ${{ matrix.tf }} --shard ${{ matrix.shard }} --shards 8 --out psar-distance-age-${{ matrix.tf }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with: {name: psar-distance-age-${{ matrix.tf }}-${{ matrix.shard }}, path: psar-distance-age-${{ matrix.tf }}-${{ matrix.shard }}.json}
