name: Continuation Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research-continuation-mining
    paths:
      - "research/continuation_validation.py"
      - ".github/workflows/continuation-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-continuation-mining
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Run continuation validation
        run: cd research && python continuation_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-validation-results
          path: research/continuation_validation_results/
          retention-days: 14
