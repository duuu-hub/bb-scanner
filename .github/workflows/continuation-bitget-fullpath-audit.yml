name: Continuation Bitget Full Candle Replay
on:
  push:
    branches: [research-core-portfolio-5y]
    paths: ['research/continuation_bitget_fullpath_audit.py']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Reuse frozen OOS signal timestamps and tracked full 15m candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bitget_artifact bitget_fullpath_results
          gh run download 36067424646 --repo duuu-hub/bb-scanner --name continuation-execution-results --dir bitget_artifact
          git fetch --depth=1 origin research-continuation-mining
          test -s bitget_artifact/trades.csv.gz
      - name: Replay each candidate on every actual subsequent 15m candle
        run: |
          set -o pipefail
          python research/continuation_bitget_fullpath_audit.py 2>&1 | tee bitget_fullpath_results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-bitget-fullpath-replay
          path: bitget_fullpath_results/
          retention-days: 30
