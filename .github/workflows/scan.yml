name: Bitget BB Scanner + LONG3 Demo

on:
  workflow_dispatch:
  schedule:
    # Heartbeat only. The active job stays alive for 16 quarter-hour boundaries
    # (~4 hours). While it runs, newer scheduled events remain pending under
    # the same concurrency group and provide a ready handoff job.
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: bitget-bb-scanner-long3
  cancel-in-progress: false

jobs:
  four-hour-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued heartbeat may have been created hours earlier. Always
          # start the watcher from the latest default-branch state.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run LONG3 four-hour watcher
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RE_ALERT_PRICE_MOVE_PCT: '5.0'
          LONG3_STATE_BRANCH: main
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python long3_watcher.py --cycles 1 --manual-immediate
          else
            python long3_watcher.py --cycles 16
          fi
