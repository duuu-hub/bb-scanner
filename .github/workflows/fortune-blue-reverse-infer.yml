name: Fortune Blue Reverse Inference 5Y
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/fortune_blue_reverse_infer_run']
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Syntax/import smoke
        run: |
          python -m py_compile scripts/fortune_blue_reverse_infer.py scripts/fortune_blue_reverse_merge.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          import scripts.fortune_blue_reverse_infer as x
          assert len(x.FORTUNE)==4 and len(x.BLUE)==6
          assert len(x.MAJORS)==10
          print("FORTUNE_BLUE_REVERSE_SMOKE_PASS")
          PY

  replay:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen Binance 15m 5Y data
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          mkdir -p data
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Reverse-inference replay
        run: python scripts/fortune_blue_reverse_infer.py --data data --shard ${{ matrix.shard }} --shards 5
      - uses: actions/upload-artifact@v4
        with:
          name: fortune-blue-reverse-${{ matrix.shard }}
          path: |
            fortune_blue_infer_${{ matrix.shard }}.csv.gz
            fortune_blue_infer_meta_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: fortune-blue-reverse-*
          path: artifacts
      - run: python scripts/fortune_blue_reverse_merge.py --input artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: fortune-blue-reverse-final
          path: |
            fortune_blue_infer_summary.csv
            fortune_blue_infer_report.md
            fortune_blue_infer_all.csv.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
