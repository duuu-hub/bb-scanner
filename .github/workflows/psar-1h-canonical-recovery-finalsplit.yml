name: PSAR 1H Canonical Recovery Final Split
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1h_canonical_recovery_finalsplit_run']
permissions: {contents: read, actions: read}

jobs:
  stats:
    strategy:
      fail-fast: false
      matrix: {shard: [233,489,745,1001]}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Run final-split canonical statistics
        run: |
          export PSAR_ENGINE_BLOB_SHA=$(git hash-object scripts/psar_open_canonical_compare.py)
          python scripts/psar_open_canonical_compare.py --data data --tf 1h --shard ${{ matrix.shard }} --shards 1024 --out psar_1h_finalsplit_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1h-canonical-finalsplit-${{ matrix.shard }}
          path: psar_1h_finalsplit_${{ matrix.shard }}.json

  merge:
    needs: stats
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download preserved successful components
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p old prior quarter subquarter
          for s in 0 2 5 6 7; do
            gh run download 36387193831 -R ${{ github.repository }} -n psar-1h-stats-$s -D old/$s
          done
          for s in 1 3 4 11; do
            gh run download 36470583311 -R ${{ github.repository }} -n psar-1h-canonical-recovery-$s -D prior/$s
          done
          for s in 9 25 57 12 28 44 60; do
            gh run download 36507299281 -R ${{ github.repository }} -n psar-1h-canonical-quarter-$s -D quarter/$s
          done
          for s in 41 105 169; do
            gh run download 36537297145 -R ${{ github.repository }} -n psar-1h-canonical-subquarter-$s -D subquarter/$s
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: psar-1h-canonical-finalsplit-*
          path: new
      - name: Merge exact coverage and validate
        run: |
          python - <<'PY'
          import glob,json
          fs=glob.glob("old/**/*.json",recursive=True)+glob.glob("prior/**/*.json",recursive=True)+glob.glob("quarter/**/*.json",recursive=True)+glob.glob("subquarter/**/*.json",recursive=True)+glob.glob("new/**/*.json",recursive=True)
          assert len(fs)==23,f"expected 23 component jsons got {len(fs)}"
          ds=[json.load(open(x)) for x in fs]
          assert all(not d.get("errors") for d in ds),"component errors"
          expected={d["definition"]["input_files_total"] for d in ds}
          assert len(expected)==1,expected
          assert sum(d["files"] for d in ds)==next(iter(expected)),(sum(d["files"] for d in ds),expected)
          semantic_drop={"shard_index","shard_count","workflow_commit_sha"}
          def sem(d): return {k:v for k,v in d["definition"].items() if k not in semantic_drop}
          assert all(sem(d)==sem(ds[0]) for d in ds),"semantic definition mismatch"
          derived={"win_pct_amb_loss","gross_expectancy_R_amb_loss"}
          agg={}
          for d in ds:
              for k,v in d["summary"].items():
                  q=agg.setdefault(k,{kk:0 for kk in v if kk not in derived})
                  for kk,vv in v.items():
                      if kk not in derived:q[kk]+=vv
          for k,q in agg.items():
              assert q["taker"]+q["maker"]==q["fills"],(k,q)
              assert q["win"]+q["loss"]+q["data_gap"]+q["exit_mismatch"]+q["unresolved_eod"]==q["fills"],(k,q)
              resolved=q["win"]+q["loss"]
              r=float(k.split("|R")[1].split("|")[0])
              q["win_pct_amb_loss"]=round(100*q["win"]/resolved,3) if resolved else None
              q["gross_expectancy_R_amb_loss"]=round((q["win"]*r-q["loss"])/resolved,5) if resolved else None
          out={"definition":sem(ds[0]),"files":sum(d["files"] for d in ds),"errors":[],"summary":agg,
               "coverage":"old mod8 + successful mod16 + successful mod64 + successful mod256 + mod1024 split of final missing 233/256"}
          json.dump(out,open("psar_1h_canonical_recovered_final3.json","w"),indent=2)
          print("FINAL3_MERGE_PASS",out["files"],len(agg))
          top=[]
          for k,q in agg.items():
              resolved=q["win"]+q["loss"]
              if not resolved: continue
              r=float(k.split("|R")[1].split("|")[0])
              pf=(q["win"]*r/q["loss"]) if q["loss"] else None
              top.append((pf or -1,k,q["win_pct_amb_loss"],q["gross_expectancy_R_amb_loss"],q["fills"],q["taker"],q["maker"]))
          for row in sorted(top,reverse=True)[:25]: print("TOP",row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psar-1h-canonical-recovered-final3
          path: psar_1h_canonical_recovered_final3.json
