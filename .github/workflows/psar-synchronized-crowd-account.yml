name: PSAR Synchronized Oversold Crowd V1
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_crowd_account_v1_launch']
permissions: {contents: read, actions: read}
jobs:
  reproduce-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - run: python scripts/psar_synchronized_crowd_account.py --audit
      - name: Download frozen trade ledgers 4/4
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir ledgers && gh run download 37741872209 -R ${{ github.repository }} -p 'psar-risk-portfolio-shard-*' -D ledgers
      - run: python scripts/psar_synchronized_crowd_account.py --data ledgers --out psar-crowd-account-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-crowd-account-results
          path: psar-crowd-account-results.json
