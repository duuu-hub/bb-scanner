name: Crypto Universe Tests

on:
  push:
    branches:
      - crypto-only-universe
      - main
    paths:
      - "scanner.py"
      - "backtest.py"
      - "market_data/contract_filters.py"
      - "tests/test_contract_filters.py"
      - ".github/workflows/crypto-universe-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: pip install -r requirements-backtest.txt

      - name: Syntax check
        run: |
          python -m py_compile market_data/contract_filters.py
          python -m py_compile scanner.py
          python -m py_compile backtest.py

      - name: Verify crypto-only automatic universes
        run: python -m unittest -v tests/test_contract_filters.py
