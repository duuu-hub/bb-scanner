name: PSAR 1D Live Breadth Study
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_1d_live_breadth_trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: psar-1d-live-breadth
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Compile
        run: python -m py_compile scripts/psar_1d_live_portfolio.py scripts/psar_1d_live_admission.py scripts/psar_1d_live_breadth.py
      - name: Download immutable sources
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
          gh run download 36817230406 -R ${{ github.repository }} -p 'psar-1d-canonical-reconcile-*' -D canonical
      - name: TRAIN-only breadth and risk freeze then HOLDOUT replay
        run: python scripts/psar_1d_live_breadth.py --data data --canonical canonical --out results
      - name: Verify outputs
        run: |
          test -s results/summary.json
          test -s results/REPORT.md
          test -s results/train_breadth_grid.csv
          test -s results/train_risk_grid.csv
          test -s results/holdout_stress.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psar-1d-live-breadth-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
