name: Continuation 1m Resolve
on:
  push:
    branches: [research-continuation-mining]
    paths: ["research/continuation_1m_resolve.py",".github/workflows/continuation-1m-resolve.yml"]
  workflow_dispatch:
jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-continuation-mining, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - name: Build phase1 inputs
        run: python research/continuation_execution_validation.py
      - name: Resolve ambiguity shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "6"
        run: python research/continuation_1m_resolve.py
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-1m-shard-${{ matrix.shard }}
          path: continuation_1m_results/
          retention-days: 14
