name: Cross-Sectional Leader V9 Research Cycle
'on':
  push:
    branches:
    - research-cross-sectional-leader-v9
    paths:
    - .research/cross-sectional-leader-v9-run
permissions:
  contents: read
  actions: read
concurrency:
  group: cross-sectional-leader-v9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3 numba==0.62.1
    - name: Causal rank, canonical chronology and account validation
      shell: bash
      run: |
        set -euo pipefail
        python -m py_compile scripts/cross_sectional_ranks_v9.py scripts/cross_sectional_leader_v9.py scripts/official_minute_provenance.py scripts/day_edge_canonical.py scripts/research_evidence_archive.py
        python - <<'CHECK'
        import json,hashlib
        from pathlib import Path
        p=Path('research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json')
        d=json.loads(p.read_text())
        assert d['source_data_run']==36095439671
        assert len(d['expected_csv_sha256'])==256
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='0c3f09f41127e29cbf7130891e9f2c1389c99798d43e470825c973acbcd5121f'
        for name in ['PLAN.md','IMPLEMENTATION_CONTRACT.md']:
         assert (p.parent/name).is_file()
        print('FROZEN_V9_INPUT_CONTRACT_PASS',256)
        CHECK
        python - <<'TESTS' 2>&1 | tee v9-tests.log
        import unittest,sys
        files=['test_btc_factor_lag_v6.py', 'test_compression_expansion_v4.py', 'test_cross_sectional_leader_v9.py', 'test_day_edge_canonical.py', 'test_day_edge_lab.py', 'test_funding_crowding_v7.py', 'test_liquidity_sweep_v5.py', 'test_premium_absorption_v8.py', 'test_relative_pullback_v1.py', 'test_research_evidence_archive.py', 'test_saved_calendar_audit.py', 'test_shock_confirmation_v3.py']
        suite=unittest.TestSuite()
        for filename in files:
         suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=filename))
        assert suite.countTestCases()==232
        result=unittest.TextTestRunner(verbosity=2).run(suite)
        sys.exit(0 if result.wasSuccessful() else 1)
        TESTS
        python scripts/psar_chronology_smoke.py 2>&1 | tee chronology-smoke.log
        python scripts/cross_sectional_ranks_v9.py smoke --out synthetic-v9 2>&1 | tee rank-map-reduce-smoke.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-validation
        path: |-
          v9-tests.log
          chronology-smoke.log
          rank-map-reduce-smoke.log
          synthetic-v9/
          research/cross-sectional-leader-v9/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
  map_development:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: |-
        set -euo pipefail
        if [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then
          gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
        fi
        gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
        gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest
        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out map-development-${{ matrix.shard }}/source_check.json
    - name: Create exact prior-midnight daily map without exit outcomes
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_ranks_v9.py map --stage DEV --data data --btc btc/BTCUSDT.csv.gz --source-check map-development-${{ matrix.shard }}/source_check.json --out map-development-${{ matrix.shard }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-map-development-${{ matrix.shard }}
        path: map-development-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
  ranks_development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        pattern: cross-sectional-leader-v9-map-development-[0-7]
        path: maps
    - name: Reduce and freeze globally ranked universe before exit scans
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_ranks_v9.py reduce --stage DEV --parts maps --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out frozen-ranks
        mkdir -p research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-development
        cp frozen-ranks/* research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-development/
        cp -r maps research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-development/original-map-shards
    - name: Preserve ranks-development on a separate research branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "research-cross-sectional-leader-v9-ranks-development-${{ github.run_id }}"
        git add "research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-development"
        git commit -m "Preserve V9 ranks-development before subsequent research stages"
        git push origin HEAD
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-ranks-development
        path: frozen-ranks/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: map_development
    permissions:
      contents: write
      actions: read
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: |-
        set -euo pipefail
        if [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then
          gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
        fi
        gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
        gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest
        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out dev-${{ matrix.shard }}/source_check.json
    - uses: actions/download-artifact@v4
      with:
        name: cross-sectional-leader-v9-ranks-development
        path: frozen-ranks
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: cross-sectional-leader-v9-dev-1m-shard-${{ matrix.shard }}
        restore-keys: |-
          premium-absorption-v8-dev-1m-shard-${{ matrix.shard }}
          factor-lag-v6-dev-1m-shard-${{ matrix.shard }}
    - name: Canonical exit scan on frozen prior-day ranks
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_leader_v9.py scan --stage DEV --data data --btc btc/BTCUSDT.csv.gz --ranks frozen-ranks --source-check dev-${{ matrix.shard }}/source_check.json --out dev-${{ matrix.shard }} --minute-cache cache/verified-1m
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-dev-${{ matrix.shard }}
        path: dev-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: ranks_development
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
  map_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: |-
        set -euo pipefail
        if [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then
          gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
        fi
        gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
        gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest
        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out map-gate-${{ matrix.shard }}/source_check.json
    - name: Create exact prior-midnight daily map without exit outcomes
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_ranks_v9.py map --stage GATE --data data --btc btc/BTCUSDT.csv.gz --source-check map-gate-${{ matrix.shard }}/source_check.json --out map-gate-${{ matrix.shard }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-map-gate-${{ matrix.shard }}
        path: map-gate-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    if: needs.selection.outputs.selected_count != '0'
  ranks_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        pattern: cross-sectional-leader-v9-map-gate-[0-7]
        path: maps
    - name: Reduce and freeze globally ranked universe before exit scans
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_ranks_v9.py reduce --stage GATE --parts maps --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out frozen-ranks
        mkdir -p research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-gate
        cp frozen-ranks/* research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-gate/
        cp -r maps research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-gate/original-map-shards
    - name: Preserve ranks-gate on a separate research branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "research-cross-sectional-leader-v9-ranks-gate-${{ github.run_id }}"
        git add "research/cross-sectional-leader-v9/run-${{ github.run_id }}/ranks-gate"
        git commit -m "Preserve V9 ranks-gate before subsequent research stages"
        git push origin HEAD
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-ranks-gate
        path: frozen-ranks/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: map_gate
    permissions:
      contents: write
      actions: read
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/cache@v4
      id: source-cache
      with:
        path: data
        key: frozen-source-36095439671-15m-shard-${{ matrix.shard }}
    - name: Fetch immutable source and BTC
      shell: bash
      run: |-
        set -euo pipefail
        if [ '${{ steps.source-cache.outputs.cache-hit }}' != 'true' ]; then
          gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
        fi
        gh run download 36858492497 -R ${{ github.repository }} -n day-edge-v2-btc -D btc
        gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-manifest-shard-${{ matrix.shard }} -D source-manifest
        python scripts/research_evidence_archive.py verify-source --data data --manifests source-manifest --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out gate-${{ matrix.shard }}/source_check.json
    - uses: actions/download-artifact@v4
      with:
        name: cross-sectional-leader-v9-ranks-gate
        path: frozen-ranks
    - uses: actions/cache@v4
      with:
        path: cache/verified-1m
        key: cross-sectional-leader-v9-gate-1m-shard-${{ matrix.shard }}
        restore-keys: |-
          premium-absorption-v8-gate-1m-shard-${{ matrix.shard }}
          factor-lag-v6-gate-1m-shard-${{ matrix.shard }}
    - uses: actions/download-artifact@v4
      with:
        name: cross-sectional-leader-v9-selected
        path: selected-input
    - name: Canonical exit scan on frozen prior-day ranks
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/cross_sectional_leader_v9.py scan --stage GATE --data data --btc btc/BTCUSDT.csv.gz --ranks frozen-ranks --source-check gate-${{ matrix.shard }}/source_check.json --out gate-${{ matrix.shard }} --minute-cache cache/verified-1m --selection selected-input/selection.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-gate-${{ matrix.shard }}
        path: gate-${{ matrix.shard }}/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs:
    - ranks_gate
    - selection
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        pattern: cross-sectional-leader-v9-dev-[0-7]
        path: dev-parts
    - name: Freeze DEV selection before gate data processing
      shell: bash
      run: |
        set -euo pipefail
        python scripts/cross_sectional_leader_v9.py select --parts dev-parts --out selected-input
        python - <<'SELECT'
        import json,os
        n=len(json.load(open('selected-input/selection.json'))['policies'])
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('selected_count='+str(n)+'\n')
        SELECT
      id: pick
    - name: Preserve all cells, complete shard diagnostics and exclusion counts
      shell: bash
      run: |
        set -euo pipefail
        python - <<'SAVE'
        from pathlib import Path
        import shutil,json,os,hashlib
        p=Path('research/cross-sectional-leader-v9/run-'+os.environ['GITHUB_RUN_ID']+'/development')
        shutil.copytree('selected-input',p)
        for name in ['scan_meta.json','exclusions.csv','rank_manifest.json','source_check.json']:
         for i,f in enumerate(sorted(Path('dev-parts').rglob(name))):
          shutil.copyfile(f,p/('full_dev_shard_'+str(i)+'_'+name))
        (p/'provenance.json').write_text(json.dumps(dict(run=int(os.environ['GITHUB_RUN_ID']),code_commit=os.environ['GITHUB_SHA'],
         source_data_run=36095439671,cells=96,sha256={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()}),indent=2))
        SAVE
    - name: Preserve dev on a separate research branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "research-cross-sectional-leader-v9-dev-${{ github.run_id }}"
        git add "research/cross-sectional-leader-v9/run-${{ github.run_id }}/development"
        git commit -m "Preserve V9 dev before subsequent research stages"
        git push origin HEAD
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-selected
        path: selected-input/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs: development
    permissions:
      contents: write
      actions: read
    outputs:
      selected_count: ${{ steps.pick.outputs.selected_count }}
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - uses: actions/download-artifact@v4
      with:
        name: cross-sectional-leader-v9-selected
        path: combined-parts
    - uses: actions/download-artifact@v4
      with:
        pattern: cross-sectional-leader-v9-gate-[0-7]
        path: combined-parts/gate
    - name: Verify same full account marking universe
      shell: bash
      run: |
        set -euo pipefail
        gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D market
        gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-manifest-shard-*' -D source-manifests
        python scripts/research_evidence_archive.py verify-source --data market --manifests source-manifests --expected-shards 8 --baseline research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json --out leader-account/source_check.json
        python scripts/cross_sectional_leader_v9.py accounts --data market --parts combined-parts --out leader-account --selection combined-parts/selection.json
    - name: Save account arithmetic, all calendar days, curves and source hashes
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p research/cross-sectional-leader-v9/run-${{ github.run_id }}/accounts
        cp -r leader-account/. research/cross-sectional-leader-v9/run-${{ github.run_id }}/accounts/
        cp combined-parts/selection.json research/cross-sectional-leader-v9/run-${{ github.run_id }}/accounts/
        cp combined-parts/development_policy_cells.csv research/cross-sectional-leader-v9/run-${{ github.run_id }}/accounts/
    - name: Preserve results on a separate research branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "research-cross-sectional-leader-v9-results-${{ github.run_id }}"
        git add "research/cross-sectional-leader-v9/run-${{ github.run_id }}/accounts"
        git commit -m "Preserve V9 results before subsequent research stages"
        git push origin HEAD
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-sectional-leader-v9-account-details
        path: leader-account/
        retention-days: 30
        compression-level: 0
        if-no-files-found: warn
    needs:
    - selection
    - gate
    permissions:
      contents: write
      actions: read
    if: needs.selection.outputs.selected_count != '0'
  preserve_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        pip install pandas==2.3.3 numpy==2.3.3
    - name: Collect completed and failed evidence with actual Actions logs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p cycle-evidence/job-logs
        if ! gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'cross-sectional-leader-v9-*' -D cycle-evidence; then
          echo 'One or more stage artifacts unavailable; actual completed job logs retained.' > cycle-evidence/artifact-download-incomplete.txt
        fi
        gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100 > cycle-evidence/actions-jobs.json
        python - <<'JOBS' > completed-jobs.txt
        import json
        for j in json.load(open('cycle-evidence/actions-jobs.json'))['jobs']:
         if j['status']=='completed' and j['conclusion']!='skipped': print(j['id'])
        JOBS
        while read job_id; do
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/$job_id/logs > cycle-evidence/job-logs/$job_id.log
        done < completed-jobs.txt
        cp research/cross-sectional-leader-v9/PLAN.md cycle-evidence/FROZEN_PLAN.md
        cp research/cross-sectional-leader-v9/IMPLEMENTATION_CONTRACT.md cycle-evidence/
        cp research/cross-sectional-leader-v9/FROZEN_INPUT_HASHES.json cycle-evidence/
        cp research/cross-sectional-leader-v9/PREEXECUTION_VALIDATION.json cycle-evidence/
    - name: Archive every original trial, source, failure and audit
      shell: bash
      run: |-
        set -euo pipefail
        python scripts/research_evidence_archive.py archive --source cycle-evidence --kind V9-complete-or-partial --out research/cross-sectional-leader-v9/run-${{ github.run_id }}/complete-evidence
    - name: Preserve evidence on a separate research branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "research-cross-sectional-leader-v9-evidence-${{ github.run_id }}"
        git add "research/cross-sectional-leader-v9/run-${{ github.run_id }}/complete-evidence"
        git commit -m "Preserve V9 evidence before subsequent research stages"
        git push origin HEAD
    needs:
    - validate
    - map_development
    - ranks_development
    - development
    - map_gate
    - ranks_gate
    - gate
    - selection
    - accounts
    permissions:
      contents: write
      actions: read
    if: always()
