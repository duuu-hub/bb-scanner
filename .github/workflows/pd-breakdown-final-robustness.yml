name: PD Breakdown Final Robustness
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_final_robustness_once']
permissions: {contents: read, actions: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_final_robustness.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: trades}
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36211084008, name: pd-breakdown-walkforward-basket-VERIFIED, path: wf}
      - run: python research/pd_breakdown_final_robustness.py --trades trades/trades_all.csv --wf wf/walkforward.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd,numpy as np
          g=pd.read_csv("out/grid.csv");a=pd.read_csv("out/annual.csv");r=pd.read_csv("out/robustness.csv")
          assert len(g)==84 and set(a.year)=={2023,2024,2025,2026}
          assert np.isfinite(g.final_equity).all() and (g.final_equity>0).all()
          print("VERIFIED",len(g),len(a),len(r),"robust_pass",int(r.all_years_positive.sum()))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-final-robustness-VERIFIED, path: out/, if-no-files-found: error}
