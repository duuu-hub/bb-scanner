name: Short Continuation Cost V1
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/short_continuation_cost_v1_run']
permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Syntax and regression tests
        run: |
          python -m py_compile scripts/short_continuation_cost_v1.py scripts/short_continuation_cost_v1_merge.py scripts/sweep_reclaim_research.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          import numpy as np
          import scripts.short_continuation_cost_v1 as s
          import scripts.sweep_reclaim_research as b
          assert len(s.CONFIGS)==24
          assert {x["mode"] for x in s.CONFIGS}=={"IMM","CONF"}
          assert {x["sl_atr"] for x in s.CONFIGS}=={1.0,1.5,2.0}
          assert {x["tp_r"] for x in s.CONFIGS}=={1.5,2.0,2.5,3.0}
          # Short return regression: entry 100 -> timeout exit 90 = +10%.
          t=np.array([0,900000,1800000],dtype=np.int64)
          o=np.array([100.,100.,100.]);h=np.array([101.,101.,101.]);l=np.array([99.,89.,99.]);c=np.array([100.,90.,100.])
          z=b.trade("TEST",t,o,h,l,c,0,"short",110.,80.,1)
          assert z is not None and abs(z["gross_return"]-0.10)<1e-12, z
          print("SHORT_CONTINUATION_COST_SMOKE_PASS")
          PY

  replay:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen Binance 15m 5Y data
        env:
          GH_TOKEN: '\${{ github.token }}'
        run: |
          mkdir -p data
          gh run download 36095439671 -R \${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Replay shard
        run: python scripts/short_continuation_cost_v1.py --data data --shard \${{ matrix.shard }} --shards 6
      - uses: actions/upload-artifact@v4
        with:
          name: short-continuation-cost-v1-\${{ matrix.shard }}
          path: |
            short_continuation_cost_\${{ matrix.shard }}.csv.gz
            short_continuation_cost_meta_\${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: short-continuation-cost-v1-*
          path: artifacts
      - name: Merge and cost sensitivity
        run: python scripts/short_continuation_cost_v1_merge.py --input artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: short-continuation-cost-v1-final
          path: |
            short_continuation_cost_summary.csv
            short_continuation_cost_yearly.csv
            short_continuation_cost_report.md
            short_continuation_cost_all.csv.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
