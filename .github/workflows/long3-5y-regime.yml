name: LONG3 5Y Regime Backtest
on:
  push:
    branches: [research-long3-5y-regime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - name: Download canonical USD-M 5Y dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p canonical_um
          gh release download binance-15m-5y-canonical-v1 --repo duuu-hub/bb-scanner --pattern 'binance-um-15m-5y-parquet-shard-*.zip' --dir downloads
          for f in downloads/*.zip; do unzip -q "$f" -d unpack; done
          mv unpack/um/*.parquet canonical_um/
          echo "parquet files: $(find canonical_um -name '*.parquet' | wc -l)"
      - name: Run LONG3 exact-rule 5Y regime replay
        run: |
          mkdir -p artifacts
          set -o pipefail
          python research/long3_5y_regime.py 2>&1 | tee artifacts/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long3-5y-regime
          path: artifacts/
          retention-days: 30
