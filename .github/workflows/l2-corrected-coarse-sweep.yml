name: L2 corrected coarse sweep
on:
  workflow_dispatch:
  push:
    branches: [research-core-l2-portfolio]
    paths: [research/l2_corrected_coarse_sweep.py]
jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        rank: [3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy pyarrow requests
      - name: Download canonical 5Y data
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p canonical_um artifacts downloads
          gh release download binance-15m-5y-canonical-v1 --repo "${{ github.repository }}" -p 'binance-spot-15m-5y-parquet-shard-*.zip' -D downloads
          for z in downloads/*.zip; do
            unzip -q -o "$z" -d canonical_um
          done
          find canonical_um -type f -name '*.parquet' | head
          test -n "$(find canonical_um -type f -name '*.parquet' -print -quit)"
      - name: Sweep rank shard
        env:
          RANK_ONLY: "${{ matrix.rank }}"
        run: python research/l2_corrected_coarse_sweep.py | tee artifacts/l2_corrected_coarse_sweep_rank${{ matrix.rank }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: l2-no-weekly-rank-${{ matrix.rank }}
          path: artifacts/
