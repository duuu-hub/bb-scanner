name: BB TF Upper Lower Study
on:
  workflow_dispatch:
  push:
    branches: [research-core-l2-portfolio]
    paths: ["research/bb_tf_upper_lower_study.py",".github/workflows/bb-tf-upper-lower-study.yml"]
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-core-l2-portfolio}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy pyarrow
      - name: Download canonical data
        run: |
          mkdir -p canonical
          gh release download binance-15m-5y-canonical-v1 -p 'binance-spot-15m-5y-parquet-shard-*.zip' -D canonical
          for f in canonical/*.zip; do unzip -q "$f" -d canonical; done
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Study
        env: {CANONICAL_5Y_DIR: canonical}
        run: python research/bb_tf_upper_lower_study.py
      - uses: actions/upload-artifact@v4
        with: {name: bb-tf-upper-lower-study, path: artifacts/, retention-days: 30}
