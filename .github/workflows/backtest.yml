name: BB Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated Bitget symbols'
        required: false
        default: '龙虾USDT,NILUSDT,INITUSDT,METISUSDT'
      days:
        description: 'Research-window days'
        required: false
        default: '60'
  push:
    paths:
      - 'backtest.py'
      - 'requirements-backtest.txt'
      - '.github/workflows/backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backtest dependencies
        run: pip install -r requirements-backtest.txt

      - name: Run research backtest
        run: |
          python backtest.py \
            --symbols "${{ inputs.symbols || '龙虾USDT,NILUSDT,INITUSDT,METISUSDT' }}" \
            --days "${{ inputs.days || '60' }}"

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-backtest-results
          path: backtest_results/
          if-no-files-found: warn
