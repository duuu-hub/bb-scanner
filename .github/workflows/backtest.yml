name: BB Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols, or AUTO30/AUTO50/AUTO100'
        required: false
        default: 'AUTO50'
      days:
        description: 'Research-window days'
        required: false
        default: '120'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backtest dependencies
        run: pip install -r requirements-backtest.txt

      - name: Run research backtest
        run: |
          python backtest.py \
            --symbols "${{ inputs.symbols || 'AUTO50' }}" \
            --days "${{ inputs.days || '120' }}"

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-backtest-results
          path: backtest_results/
          if-no-files-found: warn
