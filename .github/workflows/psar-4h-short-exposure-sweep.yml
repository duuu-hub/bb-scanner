name: PSAR 4H SHORT Exposure Sweep
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_short_exposure_sweep_run']
permissions: {contents: read, actions: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download feature shards
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p features
          gh run download 36431639340 -R ${{ github.repository }} -p 'psar-4h-short-features-*' -D features
      - name: Download sizing shards
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p sizing
          gh run download 36437560302 -R ${{ github.repository }} -p 'psar-4h-short-sizing-*' -D sizing
      - name: Exposure sweep
        run: python scripts/psar_4h_short_exposure_sweep.py --features features --sizing sizing --out psar_4h_short_exposure_sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-short-exposure-sweep
          path: psar_4h_short_exposure_sweep.json
