name: Bitget Demo API Check

on:
  workflow_dispatch:
  push:
    branches:
      - demo-trading-env
    paths:
      - 'bitget_demo_check.py'
      - '.github/workflows/bitget-demo-check.yml'

permissions:
  contents: read

jobs:
  check-demo-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Bitget Demo API
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
        run: python bitget_demo_check.py
