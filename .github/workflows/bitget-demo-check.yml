name: LONG3 Bitget Demo API Check

on:
  push:
    branches:
      - demo-long3-integration
    paths:
      - '.demo/long3_api_check_once'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-demo-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check Demo credentials and futures access
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
        run: python bitget_demo_check.py
