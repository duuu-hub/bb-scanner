name: PD Breakdown Risk Audit
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_risk_audit_once']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_risk_audit.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: input}
      - run: python research/pd_breakdown_risk_audit.py --trades input/trades_all.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/streaks.csv");c=pd.read_csv("out/capital_curve.csv");w=pd.read_csv("out/worst_windows.csv")
          assert len(s)==1 and len(c)==3 and len(w)==4
          assert ((c.mdd_pct>=0)&(c.mdd_pct<=1)).all()
          print("VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-risk-audit-VERIFIED, path: out/, if-no-files-found: error}
