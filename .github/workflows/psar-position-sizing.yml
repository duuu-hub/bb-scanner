name: PSAR Position Sizing
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_position_sizing_run']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - name: Preflight
        run: python -m py_compile scripts/psar_position_sizing.py
      - name: Download 5Y data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Run sizing
        run: python scripts/psar_position_sizing.py --data data
      - uses: actions/upload-artifact@v4
        with:
          name: psar-position-sizing
          path: |
            psar_position_sizing.json
            psar_position_sizing_ledger.csv.gz
          retention-days: 30
