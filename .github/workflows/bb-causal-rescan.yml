name: BB Causal Rescan
on:
 workflow_dispatch:
 push:
  branches: [research-core-l2-portfolio]
  paths: ["research/bb_causal_rescan.py",".github/workflows/bb-causal-rescan.yml"]
jobs:
 scan:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
     with: {ref: research-core-l2-portfolio}
   - uses: actions/setup-python@v5
     with: {python-version: "3.11"}
   - run: pip install pandas numpy pyarrow
   - name: Canonical
     run: |
      mkdir -p canonical
      gh release download binance-15m-5y-canonical-v1 -p 'binance-spot-15m-5y-parquet-shard-*.zip' -D canonical
      test "$(ls canonical/*.zip | wc -l)" -eq 16
      for f in canonical/*.zip; do unzip -q "$f" -d canonical; done
     env: {GH_TOKEN: "${{ github.token }}"}
   - name: Preflight HTF
     env: {CANONICAL_5Y_DIR: canonical}
     run: python research/bb_htf_audit.py
   - name: Compile check
     run: python -m py_compile research/bb_causal_rescan.py
   - name: Causal rescan
     env: {CANONICAL_5Y_DIR: canonical}
     run: python research/bb_causal_rescan.py
   - uses: actions/upload-artifact@v4
     with: {name: bb-causal-rescan, path: artifacts/bb_causal_rescan.csv}

