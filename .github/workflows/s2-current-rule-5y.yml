name: S2 Current Rule 5Y Replay

on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/s2_current_rule_5y.py'
      - 'scripts/s2_current_rule_5y_merge.py'
      - 'research/s2_current_rule_5y_experiment.json'
      - '.github/workflows/s2-current-rule-5y.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: s2-current-rule-5y
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - run: python -m py_compile scripts/s2_current_rule_5y.py scripts/s2_current_rule_5y_merge.py
      - run: python scripts/s2_current_rule_5y.py --raw . --out /tmp/s2 --self-test

  shard:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen 5y raw shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw
      - name: Replay fixed S2
        run: |
          rm -rf out
          python scripts/s2_current_rule_5y.py --raw raw --out out
      - uses: actions/upload-artifact@v4
        with:
          name: s2-current-rule-5y-partial-${{ matrix.shard }}
          path: |
            out/trades.csv.gz
            out/meta.json
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: s2-current-rule-5y-partial-*
          path: partials
      - name: Merge and report
        run: |
          rm -rf merged
          python scripts/s2_current_rule_5y_merge.py --partials partials --out merged
      - uses: actions/upload-artifact@v4
        with:
          name: s2-current-rule-5y-merged-${{ github.run_id }}
          path: |
            merged/s2_trades_all.csv.gz
            merged/summary_table.csv
            merged/yearly.csv
            merged/recent.csv
            merged/symbol_stats.csv
            merged/summary.json
          retention-days: 30
