name: PSAR 4H Canonical Preentry Features
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_canonical_preentry_features_run']
permissions: {contents: read, actions: read}
jobs:
  features:
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5,6,7]}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download 5Y
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p data && gh run download 36095439671 -R ${{ github.repository }} -p 'rank5-binance-um-15m-5y-data-shard-*' -D data
      - name: Extract features
        run: python scripts/psar_4h_canonical_preentry_features.py --data data --shard ${{ matrix.shard }} --shards 8 --out features_${{ matrix.shard }}.csv.gz --meta meta_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-canonical-preentry-features-${{ matrix.shard }}
          path: |
            features_${{ matrix.shard }}.csv.gz
            meta_${{ matrix.shard }}.json
