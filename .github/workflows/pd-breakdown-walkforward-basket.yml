name: PD Breakdown Walkforward Basket
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_walkforward_basket_once']
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_walkforward_basket.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: input}
      - run: python research/pd_breakdown_walkforward_basket.py --trades input/trades_all.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/sanity.csv");w=pd.read_csv("out/walkforward.csv");g=pd.read_csv("out/threshold_grid.csv")
          assert s.core_rows.iloc[0]>10000 and s.symbols.iloc[0]>500
          assert len(w)>0 and len(g)>0 and set(g.threshold)=={51,61,71,81,91,101}
          assert set(g.basket)=={5,10}
          print("VERIFIED",s.to_dict("records")[0],len(w),len(g))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-walkforward-basket-VERIFIED, path: out/, if-no-files-found: error}
