name: PSAR 4H SHORT Crowding Holdout Validation
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/psar_4h_short_crowding_validate_run']
permissions: {contents: read, actions: read}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download sizing ledger
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p source
          gh run download 36437560302 -R ${{ github.repository }} -p 'psar-4h-short-sizing-*' -D source
      - name: Holdout validate crowding
        run: |
          python - <<'PY'
          import glob,json
          import numpy as np,pandas as pd
          sfs=glob.glob("source/**/setups_*.csv.gz",recursive=True)
          efs=glob.glob("source/**/events_*.csv.gz",recursive=True)
          assert len(sfs)==8 and len(efs)==8,(len(sfs),len(efs))
          S=pd.concat([pd.read_csv(x) for x in sfs],ignore_index=True)
          E=pd.concat([pd.read_csv(x) for x in efs],ignore_index=True)
          variants=["P4T26_DD8","P9T27_DD9"]
          S=S[S.variant.isin(variants)].copy()
          E=E[E.variant.isin(variants) & E.outcome.isin(["win","loss"]) & E.pnl_pct.notna()].copy()
          C=S.groupby(["variant","signal_ts"],as_index=False).agg(setups=("setup","sum"),fills=("filled","sum"))
          E=E.merge(C,on=["variant","signal_ts"],how="left",validate="many_to_one")
          E["year"]=pd.to_datetime(E.signal_ts,unit="ms",utc=True).dt.year.astype(int)
          E["net20"]=E.pnl_pct-.20
          E["net40"]=E.pnl_pct-.40
          def pf(x):
              x=np.asarray(x,float);gp=x[x>0].sum();gl=-x[x<0].sum()
              return float(gp/gl) if gl>0 else None
          rules={
            "ALL":lambda x:np.ones(len(x),dtype=bool),
            "LE10":lambda x:x.setups<=10,
            "11_20":lambda x:(x.setups>=11)&(x.setups<=20),
            "21_40":lambda x:(x.setups>=21)&(x.setups<=40),
            "41_PLUS":lambda x:x.setups>=41,
            "GT10":lambda x:x.setups>10,
            "GT20":lambda x:x.setups>20,
            "11_40":lambda x:(x.setups>=11)&(x.setups<=40),
            "21_80":lambda x:(x.setups>=21)&(x.setups<=80),
          }
          def stats(g):
              ev=g.groupby("signal_ts").agg(avg_net20=("net20","mean"),sum_net20=("net20","sum"))
              return {
                "trades":int(len(g)),"events":int(g.signal_ts.nunique()),
                "trade_win_pct":float((g.pnl_pct>0).mean()*100) if len(g) else None,
                "net20_pf":pf(g.net20) if len(g) else None,
                "net40_pf":pf(g.net40) if len(g) else None,
                "mean_net20_pct":float(g.net20.mean()) if len(g) else None,
                "positive_event_pct":float((ev.avg_net20>0).mean()*100) if len(ev) else None,
                "event_mean_net20_pct":float(ev.avg_net20.mean()) if len(ev) else None,
                "event_sum_pf":pf(ev.sum_net20) if len(ev) else None,
              }
          out={"definition":{
            "source_sizing_run":"36437560302","btc_excluded":True,
            "train":"2021-2024","validation":"2025-2026",
            "cost":"20bp primary, 40bp stress",
            "cluster_measure":"setup count at the same 4H signal timestamp, known at scan time",
            "selection":"best TRAIN net20 PF among rules with >=10% of train trades and >=100 train events; validation untouched",
            "event_check":"also aggregate all trades sharing a signal timestamp to avoid treating clustered trades as independent"
          },"variants":{}}
          for v in variants:
              x=E[E.variant==v].copy();tr=x[x.year<=2024];va=x[x.year>=2025]
              base_n=len(tr)
              rows=[]
              for name,fn in rules.items():
                  gt=tr[fn(tr)].copy();gv=va[fn(va)].copy()
                  rec={"rule":name,"train_share_pct":float(len(gt)/base_n*100) if base_n else 0,
                       "train":stats(gt),"valid":stats(gv)}
                  # yearly holdout/robustness
                  rec["by_year"]={}
                  for y,g in x[fn(x)].groupby("year"):
                      rec["by_year"][str(int(y))]=stats(g)
                  rows.append(rec)
              eligible=[r for r in rows if r["train_share_pct"]>=10 and r["train"]["events"]>=100 and r["train"]["net20_pf"] is not None]
              eligible.sort(key=lambda r:(r["train"]["net20_pf"],r["train"]["event_sum_pf"] or -1),reverse=True)
              selected=eligible[0]["rule"] if eligible else None
              out["variants"][v]={"all_rules":rows,"train_selected_rule":selected,
                                   "selected_result":next((r for r in rows if r["rule"]==selected),None)}
              print("VAR",v,"SELECTED",selected)
              for r in rows:
                  print("RULE",v,r["rule"],
                        "share",round(r["train_share_pct"],2),
                        "trPF",None if r["train"]["net20_pf"] is None else round(r["train"]["net20_pf"],4),
                        "vaPF",None if r["valid"]["net20_pf"] is None else round(r["valid"]["net20_pf"],4),
                        "trEventPF",None if r["train"]["event_sum_pf"] is None else round(r["train"]["event_sum_pf"],4),
                        "vaEventPF",None if r["valid"]["event_sum_pf"] is None else round(r["valid"]["event_sum_pf"],4),
                        "vaPosEvent",None if r["valid"]["positive_event_pct"] is None else round(r["valid"]["positive_event_pct"],2),
                        flush=True)
          json.dump(out,open("psar_4h_short_crowding_holdout_validation.json","w"),indent=2)
          print("CROWDING_HOLDOUT_PASS",len(E),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psar-4h-short-crowding-holdout-validation
          path: psar_4h_short_crowding_holdout_validation.json
