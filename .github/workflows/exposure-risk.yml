name: Exposure Risk Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'exposure_risk.py'
      - '.github/workflows/exposure-risk.yml'

jobs:
  exposure-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Download source backtest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_backtest
          gh run download 35584621765 -n bb-backtest-results -D source_backtest

      - name: Run exposure-risk simulation
        env:
          BACKTEST_WORKERS: '6'
          BACKTEST_API_RPS: '6'
        run: |
          python exposure_risk.py \
            --source source_backtest/snapshots.csv.gz \
            --outdir exposure_risk_results \
            --workers 6 \
            --extra-symbols "LSKUSDT,TUTUSDT,LABUSDT,ALLOUSDT"

      - name: Upload exposure-risk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposure-risk-results
          path: exposure_risk_results/
          if-no-files-found: warn
