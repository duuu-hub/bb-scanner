name: AOA 3-Way Frozen OOS

on:
  push:
    branches: [research-aoa-3way-oos]
    paths:
      - "research/aoa_3way_oos/**"
      - ".github/workflows/aoa-3way-oos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-backtest.txt scikit-learn
      - run: python -m py_compile research/aoa_3way_oos/backtest_3way.py
      - run: python research/aoa_3way_oos/backtest_3way.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoa-3way-oos-results
          path: research/aoa_3way_oos/output/
          if-no-files-found: error
          retention-days: 30
