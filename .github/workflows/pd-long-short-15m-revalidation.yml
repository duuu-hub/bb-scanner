name: PD Long Short 15m Revalidation
on:
  push:
    paths: [".research/pd_long_short_15m_once"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/pd-4h-binance-universe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - name: Syntax check
        run: python -m py_compile research/pd_breakout_breakdown_long_short_15m.py
      - run: |
          mkdir -p input
          for s in 0 1 2 3 4 5 6 7; do gh run download 36095439671 -n rank5-binance-um-15m-5y-data-shard-$s -D input/shard-$s; done
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: python research/pd_breakout_breakdown_long_short_15m.py --input input --out out
      - uses: actions/upload-artifact@v4
        with: {name: pd-long-short-15m-revalidation, path: out/}
