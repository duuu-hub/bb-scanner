name: Extreme BF Retrace Plateau
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - '.research/extreme_bf_retrace_plateau_run'
permissions:
  contents: read
  actions: read
jobs:
  plateau:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download prior results and frozen data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf fire pump_data
          mkdir -p fire pump_data
          gh run download 36975297135 -D fire -n extreme-fire-patterns-36975297135
          gh run download 36095439671 -D pump_data \
            -n rank5-binance-um-15m-5y-data-shard-0 \
            -n rank5-binance-um-15m-5y-data-shard-1 \
            -n rank5-binance-um-15m-5y-data-shard-2 \
            -n rank5-binance-um-15m-5y-data-shard-3 \
            -n rank5-binance-um-15m-5y-data-shard-4 \
            -n rank5-binance-um-15m-5y-data-shard-5 \
            -n rank5-binance-um-15m-5y-data-shard-6 \
            -n rank5-binance-um-15m-5y-data-shard-7
      - name: Reconstruct BF retrace and sweep plateau
        run: |
          python - <<'PY'
          import csv,gzip,json,statistics
          from pathlib import Path
          DAY=86400000
          THRS=[40,45,50,55,60]
          BASES=[10.0,15.0,20.0]
          rows=list(csv.DictReader(open("fire/trades.csv")))
          paths={p.name.replace(".csv.gz",""):p for p in Path("pump_data").rglob("*USDT.csv.gz")}
          bfrows=[r for r in rows if float(r["base_x"]) in BASES and r["candidate"]=="BF_DD15_B10" and r.get("d7_net40_pct") not in (None,"") and r.get("d7_mae_pct") not in (None,"")]
          # event lookup for portfolio legs
          byev={}
          for r in rows:
              if float(r["base_x"]) not in BASES: continue
              k=(r["symbol"],float(r["base_x"]),r["trough_ts"],r["base_entry_ts"])
              byev.setdefault(k,{})[r["candidate"]]=r

          recs=[]
          for rr in bfrows:
              sym=rr["symbol"]; base=float(rr["base_x"])
              base_ts=int(float(rr["base_entry_ts"])); sig_ts=int(float(rr["signal_ts"]))
              target_frozen=float(rr["break_level"]); prior_peak=float(rr["peak_at_confirm"])
              data=[]
              with gzip.open(paths[sym],"rt",encoding="utf-8",newline="") as f:
                  rd=csv.DictReader(f)
                  for x in rd:
                      ts=int(x["open_time"])
                      if ts<base_ts: continue
                      if ts>sig_ts+7*DAY: break
                      data.append((ts,float(x["open"]),float(x["high"]),float(x["low"]),float(x["close"])))
              pre=[x for x in data if x[0]<sig_ts]
              post=[x for x in data if x[0]>=sig_ts]
              if not pre: continue
              running_peak=max(pre[0][1],pre[0][2])
              armed=False; rebound=False; low=None; reb_high=None; retr=None
              for ts,o,h,l,c in pre:
                  if h>running_peak:
                      running_peak=h;armed=False;rebound=False;low=None;reb_high=None
                  dd=max(0,1-c/running_peak)
                  if not armed:
                      if dd>=0.15:
                          armed=True;low=l
                  elif not rebound:
                      low=min(low,l)
                      if h>=low*1.10 and h<running_peak*0.995:
                          rebound=True;reb_high=h
                  else:
                      reb_high=max(reb_high,h)
                      if c<state_frozen:
                          if running_peak>low:
                              retr=(reb_high-low)/(running_peak-low)*100
                          break
              if retr is None: continue
              maxh=max(x[2] for x in post) if post else -1
              recs.append({
                  "symbol":sym,"base_x":base,"base_entry_ts":rr["base_entry_ts"],
                  "retrace_pct":retr,
                  "reclaimed_7d":maxh>prior_peak,
                  "d7_ret":float(rr["d7_net40_pct"]),
                  "d7_mae":float(rr["d7_mae_pct"]),
              })

          def stat(xs):
              if not xs:return {"n":0}
              rets=[x["d7_ret"] for x in xs];maes=[x["d7_mae"] for x in xs]
              return {
                  "n":len(xs),
                  "reclaim_pct":round(100*sum(x["reclaimed_7d"] for x in xs)/len(xs),2),
                  "mean_ret":round(sum(rets)/len(rets),2),
                  "median_ret":round(statistics.median(rets),2),
                  "win_pct":round(100*sum(x>0 for x in rets)/len(rets),2),
                  "mean_mae":round(sum(maes)/len(maes),2),
                  "median_mae":round(statistics.median(maes),2),
                  "max_mae":round(max(maes),2),
              }

          print("PLATEAU")
          for b in BASES:
              bx=[x for x in recs if x["base_x"]==b]
              for t in THRS:
                  weak=[x for x in bx if x["retrace_pct"]<t]
                  strong=[x for x in bx if x["retrace_pct"]>=t]
                  print(json.dumps({"base_x":b,"threshold":t,"weak":stat(weak),"strong":stat(strong)},ensure_ascii=False))

          # 20x portfolio: base5 always. BF +5 only if retrace>=threshold.
          # DD30 variants: A always allowed; B only allowed when retrace>=threshold.
          rmap={(x["symbol"],x["base_x"],x["base_entry_ts"]):x for x in recs}
          print("PORTFOLIO20")
          events=[]
          for k,v in byev.items():
              if k[1]!=20.0 or "BASE_IMMEDIATE" not in v: continue
              events.append((k,v))
          for t in THRS:
              for mode in ("BF_GATED_DD_ALWAYS","BF_AND_DD_GATED"):
                  pnls=[];stresses=[];used=[];wins=0
                  for k,ev in events:
                      pnl=stress=notional=0.0
                      base=ev["BASE_IMMEDIATE"]
                      if base.get("d7_net40_pct") not in (None,""):
                          pnl+=5*float(base["d7_net40_pct"])/100
                          stress+=5*float(base["d7_mae_pct"])/100
                          notional+=5
                      rec=rmap.get((k[0],20.0,k[3]))
                      strong=bool(rec and rec["retrace_pct"]>=t)
                      bf=ev.get("BF_DD15_B10")
                      if strong and bf and bf.get("d7_net40_pct") not in (None,""):
                          pnl+=5*float(bf["d7_net40_pct"])/100
                          stress+=5*float(bf["d7_mae_pct"])/100
                          notional+=5
                      dd=ev.get("DD30")
                      allow_dd = (mode=="BF_GATED_DD_ALWAYS") or strong
                      if allow_dd and dd and dd.get("d7_net40_pct") not in (None,""):
                          pnl+=5*float(dd["d7_net40_pct"])/100
                          stress+=5*float(dd["d7_mae_pct"])/100
                          notional+=5
                      pnls.append(pnl);stresses.append(stress);used.append(notional)
                  print(json.dumps({
                      "threshold":t,"mode":mode,"events":len(pnls),
                      "sum_account_pnl_pct":round(sum(pnls),2),
                      "mean_event_pnl_pct":round(sum(pnls)/len(pnls),3),
                      "win_pct":round(100*sum(x>0 for x in pnls)/len(pnls),2),
                      "worst_event_pct":round(min(pnls),2),
                      "max_mae_stress_pct":round(max(stresses),2),
                      "mean_notional_pct":round(sum(used)/len(used),2)
                  },ensure_ascii=False))
          PY
