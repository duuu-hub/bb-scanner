name: PD Breakdown 15m Execution Audit
on:
  workflow_dispatch:
  push:
    paths: [".research/pd_breakdown_15m_execution_audit_once"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/pd-4h-binance-universe}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - run: |
          mkdir -p input
          for s in 0 1 2 3 4 5 6 7; do gh run download 36095439671 -n rank5-binance-um-15m-5y-data-shard-$s -D input/shard-$s; done
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with:
          github-token: "${{ github.token }}"
          run-id: 36281112666
          name: pd-breakdown-selector-risk-portfolio-VERIFIED
          path: pd
      - run: python research/pd_breakdown_15m_execution_audit.py --input input --selected pd/selected_trades.csv --out out
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-15m-execution-audit, path: out/}
