name: Extreme Extension Pyramid Portfolio

on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - '.research/extreme_extension_pyramid_portfolio_run'

permissions:
  contents: read
  actions: read

jobs:
  pyramid:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile research/extreme_extension_pyramid_portfolio.py

      - name: Download frozen 5Y shards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p pump_data
          gh run download 36095439671 -D pump_data \
            -n rank5-binance-um-15m-5y-data-shard-0 \
            -n rank5-binance-um-15m-5y-data-shard-1 \
            -n rank5-binance-um-15m-5y-data-shard-2 \
            -n rank5-binance-um-15m-5y-data-shard-3 \
            -n rank5-binance-um-15m-5y-data-shard-4 \
            -n rank5-binance-um-15m-5y-data-shard-5 \
            -n rank5-binance-um-15m-5y-data-shard-6 \
            -n rank5-binance-um-15m-5y-data-shard-7

      - name: Run pyramid portfolio study
        run: |
          rm -rf extreme_pyramid_portfolio
          python research/extreme_extension_pyramid_portfolio.py \
            --data-root pump_data \
            --out extreme_pyramid_portfolio

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: extreme-extension-pyramid-portfolio-${{ github.run_id }}
          path: extreme_pyramid_portfolio/
          retention-days: 30
          compression-level: 6
