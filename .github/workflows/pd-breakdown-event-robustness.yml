name: PD Breakdown Event Robustness
on:
  push:
    branches: [research/pd-4h-binance-universe]
    paths: ['.research/pd_breakdown_event_robustness_once']
permissions: {contents: write, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python -m py_compile research/pd_breakdown_event_robustness.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', run-id: 36159685183, name: pd-4h-breakdown-short-VERIFIED, path: input}
      - run: python research/pd_breakdown_event_robustness.py --trades input/trades_all.csv --out out
      - run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("out/summary.csv"); th=pd.read_csv("out/thresholds.csv"); e=pd.read_csv("out/events_51plus.csv"); loo=pd.read_csv("out/loo_51plus.csv")
          assert len(s)==1 and s.oos_trades.iloc[0]==6375
          assert s.events_51plus.iloc[0]==len(e)==len(loo)
          assert (e.signals>=51).all() and (e.signals==e.symbols).all()
          assert th.min_signals.is_unique
          print("VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: pd-breakdown-event-robustness-VERIFIED, path: out/, if-no-files-found: error}
      - name: Persist verified audit
        run: |
          mkdir -p research/results/pd_breakdown_event_robustness
          cp out/*.csv research/results/pd_breakdown_event_robustness/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/results/pd_breakdown_event_robustness
          git commit -m "research: persist verified event robustness" || exit 0
          git push origin HEAD:research/pd-4h-binance-universe
