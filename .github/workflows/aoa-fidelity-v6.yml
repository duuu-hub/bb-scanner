name: AOA Fidelity V6
on:
  push:
    branches: [research-aoa-fidelity-v6]
    paths:
      - "research/aoa_fidelity_v6/**"
      - ".github/workflows/aoa-fidelity-v6.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-backtest.txt scikit-learn
      - run: python -m py_compile research/aoa_fidelity_v6/window_flip_model.py
      - run: python research/aoa_fidelity_v6/window_flip_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoa-fidelity-v6-results
          path: research/aoa_fidelity_v6/output/
          if-no-files-found: error
          retention-days: 30
