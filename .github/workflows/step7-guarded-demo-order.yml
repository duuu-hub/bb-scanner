name: Step 7 Guarded Demo Order Test

on:
  push:
    branches:
      - demo-trading-env
    paths:
      - '.demo/guarded_order_once'

permissions:
  contents: read

jobs:
  guarded-demo-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Step 7 guarded Demo order test
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          DEMO_CONFIRM: 'GUARDED_DEMO_ORDER_TEST'
          DEMO_SYMBOL: 'BTCUSDT'
          DEMO_NOTIONAL_USDT: '20'
        run: python guarded_demo_order_test.py
