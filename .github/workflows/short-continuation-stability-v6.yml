name: Short Continuation Stability V6
on:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths: ['.research/short_continuation_stability_v6_run']
permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Smoke
        run: |
          python -m py_compile scripts/short_continuation_stability_v6.py scripts/short_continuation_robustness_v3.py
      - name: Download frozen horizon V2 final artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          mkdir -p source
          gh run download 36963458040 -R ${{ github.repository }} -n short-continuation-horizon-v2-final -D source
          test -f source/short_continuation_horizon_all.csv.gz
      - name: Run stability audit
        run: |
          python scripts/short_continuation_stability_v6.py \
            --input source/short_continuation_horizon_all.csv.gz \
            --out stability_v6
      - uses: actions/upload-artifact@v4
        with:
          name: short-continuation-stability-v6-final
          path: stability_v6/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
