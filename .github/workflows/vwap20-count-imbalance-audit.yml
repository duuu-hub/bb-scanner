name: VWAP20 Count Imbalance Audit
on:
 push:
  branches: [research-rank5-binance-15m-5y]
  paths: ['.research/vwap20_count_audit_run']
jobs:
 audit:
  strategy: {matrix: {shard: [0,1,2,3,4,5,6,7]}}
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: pip install pandas numpy
   - env: {GH_TOKEN: '${{ github.token }}'}
     run: mkdir data && gh run download 36095439671 -R ${{ github.repository }} -n rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }} -D data
   - run: python scripts/vwap20_count_imbalance_audit.py
   - uses: actions/upload-artifact@v4
     with: {name: 'count-audit-${{ matrix.shard }}', path: '*.csv'}
