name: Open Outside BB Reversion Scan

on:
  workflow_dispatch:
  push:
    branches: [research-rank5-binance-15m-5y]
    paths:
      - 'scripts/open_outside_bb_reversion_scan.py'
      - 'scripts/open_outside_bb_reversion_merge.py'
      - 'research/open_outside_bb_reversion_v1.json'
      - '.github/workflows/open-outside-bb-reversion.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: open-outside-bb-reversion
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Download frozen raw shard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw
          gh run download 36095439671 -R ${{ github.repository }} \
            -n "rank5-binance-um-15m-5y-data-shard-${{ matrix.shard }}" -D raw
      - name: Scan open-outside BB reversion
        run: |
          rm -rf out
          PYTHONPATH=scripts python scripts/open_outside_bb_reversion_scan.py --raw raw --out out
      - uses: actions/upload-artifact@v4
        with:
          name: open-outside-bb-partial-${{ matrix.shard }}
          path: |
            out/events.csv.gz
            out/meta.json
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          pattern: open-outside-bb-partial-*
          path: partials
      - run: |
          rm -rf merged
          python scripts/open_outside_bb_reversion_merge.py --partials partials --out merged
      - uses: actions/upload-artifact@v4
        with:
          name: open-outside-bb-reversion-merged-${{ github.run_id }}
          path: |
            merged/events_all.csv.gz
            merged/fresh_thresholds.csv
            merged/summary.json
          retention-days: 30
